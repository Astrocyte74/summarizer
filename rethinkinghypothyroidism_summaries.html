        "html": "<h1>Summary: Rethinking Thyroid Hormone Replacement Therapy</h1>\n<p><em>Note: This analysis is based on the chapter endnotes provided, which reveal a comprehensive critique of conventional hypothyroidism treatment.</em></p>\n<hr />\n<h2><strong>Key Ideas</strong></h2>\n<ul>\n<li>\n<p><strong>The T4 Monotherapy Paradigm is Incomplete</strong>: Despite levothyroxine (T4) being the standard of care for decades, a significant subset of patients remains symptomatic even with \"normal\" TSH levels, suggesting tissue-level hypothyroidism persists.</p>\n</li>\n<li>\n<p><strong>Deiodinase Enzymes Are Critical Gatekeepers</strong>: The conversion of T4 to active T3 is not uniform across tissues. DIO2 (Type 2 deiodinase) polymorphisms affect 15-20% of the population, impairing local T3 generation and creating a genetic basis for treatment resistance.</p>\n</li>\n<li>\n<p><strong>Pharmaceutical Interests Shaped Guidelines</strong>: The survival of Synthroid\u00ae as a brand-name drug despite bioequivalence controversies (1990s FDA battles) and industry-funded research suppression demonstrates how commercial interests can influence medical practice.</p>\n</li>\n<li>\n<p><strong>Historical Amnesia in Modern Medicine</strong>: Early thyroid replacement (1890s-1960s) used desiccated thyroid containing both T4 and T3. The shift to synthetic T4-only therapy was based on pharmaceutical stability, not clinical superiority, abandarding a more physiological approach.</p>\n</li>\n<li>\n<p><strong>Tissue vs. Serum Euthyroidism</strong>: Normal circulating hormone levels do not guarantee euthyroidism at the tissue level. The brain, heart, and skeletal muscle rely heavily on local T4-to-T3 conversion, which can be disrupted by inflammation, selenium deficiency, or genetic variants.</p>\n</li>\n<li>\n<p><strong>Patient Dissatisfaction is Data</strong>: Large surveys (Peterson et al., 2018) showing 40%+ dissatisfaction with levothyroxine represent valid clinical signals, not psychological problems or non-compliance.</p>\n</li>\n</ul>\n<hr />\n<h2><strong>Golden Nuggets</strong></h2>\n<ul>\n<li>\n<p><strong>\"A Normal TSH is Not Synonymous with Euthyroidism\"</strong>: This paradigm-shifting concept (Chapter 9) reframes the entire diagnostic approach\u2014biochemical normalization \u2260 clinical wellness.</p>\n</li>\n<li>\n<p><strong>The \"Tissue Thyrotoxicosis\" Paradox</strong>: Patients on adequate levothyroxine doses often have elevated serum T4 but insufficient T3 in target tissues, creating simultaneous hyper- and hypothyroid states.</p>\n</li>\n<li>\n<p><strong>DIO2 Thr92Ala Polymorphism</strong>: This single genetic variant reduces deiodinase activity by 20-30%, explaining why 15-20% of patients feel better on combination therapy\u2014it's not psychosomatic, it's biochemical.</p>\n</li>\n<li>\n<p><strong>Ubiquitin-Proteasome Regulation</strong>: Deiodinases are controlled by rapid proteasomal degradation, not just transcription. This \"biochemical switchboard\" responds within hours to stress, illness, and medication changes.</p>\n</li>\n<li>\n<p><strong>The Synthroid\u00ae Rejection Study</strong>: When a 1996 study showed generic bioequivalence, the manufacturer (Boots/Baxter) tried to suppress publication, revealing ethical conflicts in thyroid drug research funding.</p>\n</li>\n</ul>\n<hr />\n<h2><strong>Practical and Applicable</strong></h2>\n<h3><strong>For Patients:</strong></h3>\n<ol>\n<li><strong>Genetic Testing</strong>: If symptomatic on levothyroxine, ask for DIO2 (Thr92Ala) genotyping\u2014this single test identifies likely responders to combination therapy.</li>\n<li><strong>Symptom Scoring</strong>: Use validated tools like the Zulewski Clinical Score to quantify tissue hypothyroidism symptoms (dry skin, delayed reflexes, cognitive fog) rather than relying solely on TSH.</li>\n<li><strong>Trial of Combination Therapy</strong>: For persistent symptoms, advocate for a 3-month trial of T4/T3 combination (e.g., 95mcg T4 + 5mcg T3) with pre/post quality of life measures.</li>\n<li><strong>Nutritional Support</strong>: Ensure selenium intake (Brazil nuts, seafood) for optimal deiodinase function\u2014deficiency mimics hypothyroidism.</li>\n</ol>\n<h3><strong>For Clinicians:</strong></h3>\n<ol>\n<li><strong>Re-examine \"Normal\" Ranges</strong>: A TSH of 2.5-4.0 mIU/L with symptoms may indicate suboptimal treatment, not \"euthyroidism.\"</li>\n<li><strong>Personalize Dosing</strong>: Calculate levothyroxine dose based on lean body mass, not just weight, and adjust for DIO2 polymorphism status.</li>\n<li><strong>Monitor Free T3</strong>: While controversial, checking free T3/reverse T3 ratios can identify conversion problems, especially in athyreotic patients.</li>\n<li><strong>Consider Desiccated Thyroid</strong>: For treatment-resistant patients, a trial of desiccated thyroid extract (1-2 grains) provides a physiologic 4:1 T4:T3 ratio that may better mimic human thyroid secretion.</li>\n</ol>\n<hr />\n<h2><strong>Paradigms and Thinking Models</strong></h2>\n<h3><strong>1. The Tissue Microenvironment Model</strong></h3>\n<p>Thyroid status is determined at the cellular level by local deiodinase activity, not serum hormone levels. This explains why athletes (high DIO2 expression) and obese individuals (low DIO2) respond differently to standard doses.</p>\n<h3><strong>2. Pharmacogenomics-Guided Therapy</strong></h3>\n<p>Treatment response is predictable by genotype: DIO2 Ala/Ala carriers need 15-20% more T3 relative to T4. This moves thyroid therapy from population-based to precision medicine.</p>\n<h3><strong>3. The Pharmaceutical Capture Model</strong></h3>\n<p>The dominance of T4-only therapy represents market success, not clinical superiority. The 2002 Synthroid\u00ae FDA approval created a regulatory precedent that stifled innovation for decades.</p>\n<h3><strong>4. Evolutionary Mismatch Hypothesis</strong></h3>\n<p>The human thyroid secretes ~10% T3 directly, while modern therapy provides 0% direct T3. This evolutionary mismatch may explain the \"brain fog\" and mood symptoms in treated patients.</p>\n<h3><strong>5. Ubiquitination as a Therapeutic Target</strong></h3>\n<p>Understanding that deiodinases are regulated by proteasomal degradation opens new drug targets: WSB-1 inhibitors could stabilize DIO2, mimicking genetic polymorphism benefits.</p>\n<hr />\n<p><strong>Core Message</strong>: The century-long experiment with synthetic T4 monotherapy has reached its limits. A new paradigm integrating genetics, tissue-level physiology, and patient-reported outcomes is necessary to resolve the \"hypothyroidism paradox\"\u2014biochemically treated but clinically unwell patients.</p>",
        "content": "# Summary: Rethinking Thyroid Hormone Replacement Therapy\n\n*Note: This analysis is based on the chapter endnotes provided, which reveal a comprehensive critique of conventional hypothyroidism treatment.*\n\n---\n\n## **Key Ideas**\n\n- **The T4 Monotherapy Paradigm is Incomplete**: Despite levothyroxine (T4) being the standard of care for decades, a significant subset of patients remains symptomatic even with \"normal\" TSH levels, suggesting tissue-level hypothyroidism persists.\n  \n- **Deiodinase Enzymes Are Critical Gatekeepers**: The conversion of T4 to active T3 is not uniform across tissues. DIO2 (Type 2 deiodinase) polymorphisms affect 15-20% of the population, impairing local T3 generation and creating a genetic basis for treatment resistance.\n\n- **Pharmaceutical Interests Shaped Guidelines**: The survival of Synthroid\u00ae as a brand-name drug despite bioequivalence controversies (1990s FDA battles) and industry-funded research suppression demonstrates how commercial interests can influence medical practice.\n\n- **Historical Amnesia in Modern Medicine**: Early thyroid replacement (1890s-1960s) used desiccated thyroid containing both T4 and T3. The shift to synthetic T4-only therapy was based on pharmaceutical stability, not clinical superiority, abandarding a more physiological approach.\n\n- **Tissue vs. Serum Euthyroidism**: Normal circulating hormone levels do not guarantee euthyroidism at the tissue level. The brain, heart, and skeletal muscle rely heavily on local T4-to-T3 conversion, which can be disrupted by inflammation, selenium deficiency, or genetic variants.\n\n- **Patient Dissatisfaction is Data**: Large surveys (Peterson et al., 2018) showing 40%+ dissatisfaction with levothyroxine represent valid clinical signals, not psychological problems or non-compliance.\n\n---\n\n## **Golden Nuggets**\n\n- **\"A Normal TSH is Not Synonymous with Euthyroidism\"**: This paradigm-shifting concept (Chapter 9) reframes the entire diagnostic approach\u2014biochemical normalization \u2260 clinical wellness.\n\n- **The \"Tissue Thyrotoxicosis\" Paradox**: Patients on adequate levothyroxine doses often have elevated serum T4 but insufficient T3 in target tissues, creating simultaneous hyper- and hypothyroid states.\n\n- **DIO2 Thr92Ala Polymorphism**: This single genetic variant reduces deiodinase activity by 20-30%, explaining why 15-20% of patients feel better on combination therapy\u2014it's not psychosomatic, it's biochemical.\n\n- **Ubiquitin-Proteasome Regulation**: Deiodinases are controlled by rapid proteasomal degradation, not just transcription. This \"biochemical switchboard\" responds within hours to stress, illness, and medication changes.\n\n- **The Synthroid\u00ae Rejection Study**: When a 1996 study showed generic bioequivalence, the manufacturer (Boots/Baxter) tried to suppress publication, revealing ethical conflicts in thyroid drug research funding.\n\n---\n\n## **Practical and Applicable**\n\n### **For Patients:**\n1. **Genetic Testing**: If symptomatic on levothyroxine, ask for DIO2 (Thr92Ala) genotyping\u2014this single test identifies likely responders to combination therapy.\n2. **Symptom Scoring**: Use validated tools like the Zulewski Clinical Score to quantify tissue hypothyroidism symptoms (dry skin, delayed reflexes, cognitive fog) rather than relying solely on TSH.\n3. **Trial of Combination Therapy**: For persistent symptoms, advocate for a 3-month trial of T4/T3 combination (e.g., 95mcg T4 + 5mcg T3) with pre/post quality of life measures.\n4. **Nutritional Support**: Ensure selenium intake (Brazil nuts, seafood) for optimal deiodinase function\u2014deficiency mimics hypothyroidism.\n\n### **For Clinicians:**\n1. **Re-examine \"Normal\" Ranges**: A TSH of 2.5-4.0 mIU/L with symptoms may indicate suboptimal treatment, not \"euthyroidism.\"\n2. **Personalize Dosing**: Calculate levothyroxine dose based on lean body mass, not just weight, and adjust for DIO2 polymorphism status.\n3. **Monitor Free T3**: While controversial, checking free T3/reverse T3 ratios can identify conversion problems, especially in athyreotic patients.\n4. **Consider Desiccated Thyroid**: For treatment-resistant patients, a trial of desiccated thyroid extract (1-2 grains) provides a physiologic 4:1 T4:T3 ratio that may better mimic human thyroid secretion.\n\n---\n\n## **Paradigms and Thinking Models**\n\n### **1. The Tissue Microenvironment Model**\nThyroid status is determined at the cellular level by local deiodinase activity, not serum hormone levels. This explains why athletes (high DIO2 expression) and obese individuals (low DIO2) respond differently to standard doses.\n\n### **2. Pharmacogenomics-Guided Therapy**\nTreatment response is predictable by genotype: DIO2 Ala/Ala carriers need 15-20% more T3 relative to T4. This moves thyroid therapy from population-based to precision medicine.\n\n### **3. The Pharmaceutical Capture Model**\nThe dominance of T4-only therapy represents market success, not clinical superiority. The 2002 Synthroid\u00ae FDA approval created a regulatory precedent that stifled innovation for decades.\n\n### **4. Evolutionary Mismatch Hypothesis**\nThe human thyroid secretes ~10% T3 directly, while modern therapy provides 0% direct T3. This evolutionary mismatch may explain the \"brain fog\" and mood symptoms in treated patients.\n\n### **5. Ubiquitination as a Therapeutic Target**\nUnderstanding that deiodinases are regulated by proteasomal degradation opens new drug targets: WSB-1 inhibitors could stabilize DIO2, mimicking genetic polymorphism benefits.\n\n---\n\n**Core Message**: The century-long experiment with synthetic T4 monotherapy has reached its limits. A new paradigm integrating genetics, tissue-level physiology, and patient-reported outcomes is necessary to resolve the \"hypothyroidism paradox\"\u2014biochemically treated but clinically unwell patients."

                            <button class="sleep-timer-btn" onclick="setSleepTimer(5)">5m</button>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(10)">10m</button>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(15)">15m</button>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(30)">30m</button>
                            <div class="sleep-timer-display" id="sleepTimerDisplay">Off</div>
                        </div>
                    </div>
                    
                    <div class="audio-bookmarks" id="audioBookmarks">
                        <div style="font-size: 0.8rem; margin-bottom: 8px; color: var(--text-secondary);">Quick Bookmarks:</div>
                        <button class="bookmark-btn" onclick="jumpToPercentage(0)">Start</button>
                        <button class="bookmark-btn" onclick="jumpToPercentage(25)">25%</button>
                        <button class="bookmark-btn" onclick="jumpToPercentage(50)">50%</button>
                        <button class="bookmark-btn" onclick="jumpToPercentage(75)">75%</button>
                        <button class="bookmark-btn" onclick="addCustomBookmark()">+ Bookmark</button>
                    </div>
                    
                    <div class="audio-keyboard-hint">
                        Space: play/pause • ←→: skip 15s • ↑↓: chapters • A: auto-advance • 1-6: speed • B: bookmark
                    </div>
                </div>
            `;
        }
        
        function initializeAudioPlayer(chapter) {
            const audioElement = document.getElementById('audioPlayer');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const currentTimeSpan = document.getElementById('currentTime');
            const totalTimeSpan = document.getElementById('totalTime');
            const volumeSlider = document.getElementById('volumeSlider');
            const autoAdvanceToggle = document.getElementById('autoAdvanceToggle');
            
            if (!audioElement) return;
            
            // Stop any currently playing audio
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                clearInterval(audioProgressInterval);
            }
            
            currentAudio = audioElement;
            currentPlayingChapter = chapter.id;
            
            // Set initial volume
            audioElement.volume = currentVolume;
            volumeSlider.value = currentVolume;
            
            // Audio event listeners
            audioElement.addEventListener('loadedmetadata', () => {
                totalTimeSpan.textContent = formatTime(audioElement.duration);
                updateChapterNavigation();
            });
            
            audioElement.addEventListener('timeupdate', updateProgress);
            audioElement.addEventListener('ended', handleAudioEnded);
            audioElement.addEventListener('play', () => {
                isPlaying = true;
                updatePlayPauseButton();
                markChapterAsPlaying(chapter.id);
                startProgressTracking();
            });
            
            audioElement.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayPauseButton();
                clearChapterPlaying();
                stopProgressTracking();
            });
            
            audioElement.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                showAudioError('Failed to load audio file');
            });
            
            // Volume control
            volumeSlider.addEventListener('input', (e) => {
                const volume = parseFloat(e.target.value);
                audioElement.volume = volume;
                currentVolume = volume;
                localStorage.setItem('audioVolume_' + bookId, volume.toString());
            });
            
            // Initialize playback rate
            setPlaybackRate(currentPlaybackRate);
            updateAutoAdvanceToggle();
        }
        
        function togglePlayPause() {
            if (!currentAudio) return;
            
            if (currentAudio.paused) {
                currentAudio.play().catch(e => {
                    console.error('Play failed:', e);
                    showAudioError('Failed to play audio');
                });
            } else {
                currentAudio.pause();
            }
        }
        
        function updatePlayPauseButton() {
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }
        
        function skipAudio(seconds) {
            if (!currentAudio) return;
            currentAudio.currentTime = Math.max(0, Math.min(currentAudio.duration, currentAudio.currentTime + seconds));
        }
        
        function seekAudio(event) {
            if (!currentAudio) return;
            const progressBar = event.currentTarget;
            const rect = progressBar.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;
            currentAudio.currentTime = percentage * currentAudio.duration;
        }
        
        function updateProgress() {
            if (!currentAudio) return;
            
            const progressFill = document.getElementById('progressFill');
            const currentTimeSpan = document.getElementById('currentTime');
            const progressHandle = document.getElementById('progressHandle');
            
            const percentage = (currentAudio.currentTime / currentAudio.duration) * 100;
            progressFill.style.width = percentage + '%';
            progressHandle.style.left = percentage + '%';
            currentTimeSpan.textContent = formatTime(currentAudio.currentTime);
            
            // Update visualizer during playback
            updateAudioVisualizer();
        }
        
        function setPlaybackRate(rate) {
            if (!currentAudio) return;
            
            currentAudio.playbackRate = rate;
            currentPlaybackRate = rate;
            
            // Update active speed button
            document.querySelectorAll('.speed-button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === rate + 'x') {
                    btn.classList.add('active');
                }
            });
        }
        
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }
        
        function navigateToChapterAudio(direction) {
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
            const newIndex = currentIndex + direction;
            
            if (newIndex >= 0 && newIndex < chaptersData.length) {
                const newChapter = chaptersData[newIndex];
                selectChapter(newChapter.id);
                
                // If the new chapter has audio and we're on narrative, auto-play
                setTimeout(() => {
                    if (currentSummaryType === '_response_narrative.md' && 
                        newChapter.audio && newChapter.audio.audio_file) {
                        selectSummaryType('_response_narrative.md');
                    }
                }, 100);
            }
        }
        
        function handleAudioEnded() {
            if (autoAdvance) {
                const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
                if (currentIndex < chaptersData.length - 1) {
                    navigateToChapterAudio(1);
                }
            }
            clearChapterPlaying();
        }
        
        function toggleAutoAdvance() {
            autoAdvance = !autoAdvance;
            localStorage.setItem('autoAdvance_' + bookId, JSON.stringify(autoAdvance));
            updateAutoAdvanceToggle();
        }
        
        function updateAutoAdvanceToggle() {
            const toggle = document.getElementById('autoAdvanceToggle');
            if (toggle) {
                if (autoAdvance) {
                    toggle.classList.add('active');
                } else {
                    toggle.classList.remove('active');
                }
            }
        }
        
        function updateChapterNavigation() {
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
            const prevBtn = document.getElementById('prevChapterBtn');
            const nextBtn = document.getElementById('nextChapterBtn');
            
            if (prevBtn) prevBtn.disabled = currentIndex <= 0;
            if (nextBtn) nextBtn.disabled = currentIndex >= chaptersData.length - 1;
        }
        
        // Remove old markChapterAsPlaying and clearChapterPlaying - replaced with enhanced versions above
        
        function startProgressTracking() {
            stopProgressTracking(); // Clear any existing interval
            audioProgressInterval = setInterval(updateProgress, 250);
        }
        
        function stopProgressTracking() {
            if (audioProgressInterval) {
                clearInterval(audioProgressInterval);
                audioProgressInterval = null;
            }
        }
        
        function showAudioError(message) {
            const container = document.getElementById('audioPlayerContainer');
            if (container) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'audio-error';
                errorDiv.textContent = message;
                container.appendChild(errorDiv);
                
                setTimeout(() => {
                    errorDiv.remove();
                }, 5000);
            }
        }
        
        // Enhanced Keyboard navigation with audio support
        document.addEventListener('keydown', (e) => {
            // Ignore keyboard events if user is typing in an input
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
            
            if (e.key === 'ArrowDown' && currentIndex < chaptersData.length - 1) {
                selectChapter(chaptersData[currentIndex + 1].id);
            } else if (e.key === 'ArrowUp' && currentIndex > 0) {
                selectChapter(chaptersData[currentIndex - 1].id);
            } else if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                togglePlayPause();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                skipAudio(-15);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                skipAudio(15);
            } else if (e.key.toLowerCase() === 'a') {
                e.preventDefault();
                toggleAutoAdvance();
            } else if (e.key >= '1' && e.key <= '6') {
                // Speed control shortcuts
                const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
                const speedIndex = parseInt(e.key) - 1;
                if (speeds[speedIndex]) {
                    e.preventDefault();
                    setPlaybackRate(speeds[speedIndex]);
                }
            } else if (e.key.toLowerCase() === 'b') {
                e.preventDefault();
                addCustomBookmark();
            }
        });
        
        // Read tracking functions
        function toggleReadStatus() {
            if (!currentChapter) return;
            
            const chapterId = currentChapter.id;
            const isCurrentlyRead = readChapters.includes(chapterId);
            
            if (isCurrentlyRead) {
                readChapters = readChapters.filter(id => id !== chapterId);
            } else {
                readChapters.push(chapterId);
            }
            
            localStorage.setItem('readChapters_' + bookId, JSON.stringify(readChapters));
            
            // Update UI
            renderChapterList();
            updateProgress();
            displaySummary();
            
            // Re-select current chapter to maintain active state
            const activeIndex = chaptersData.findIndex(c => c.id === chapterId);
            document.querySelectorAll('.chapter-item')[activeIndex].classList.add('active');
        }
        
        function updateProgress() {
            const readCount = readChapters.length;
            const totalCount = chaptersData.length;
            const progressPercent = totalCount > 0 ? Math.round((readCount / totalCount) * 100) : 0;
            
            document.getElementById('readCount').textContent = readCount;
            document.getElementById('progressPercent').textContent = progressPercent + '%';
        }
        
        // Mobile navigation functions
        function updateMobileNavigation(currentIndex) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentIndex <= 0;
            nextBtn.disabled = currentIndex >= chaptersData.length - 1;
        }
        
        function navigateChapter(direction) {
            if (!currentChapter || !currentSummaryType) return;
            
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter.id);
            const newIndex = currentIndex + direction;
            
            if (newIndex >= 0 && newIndex < chaptersData.length) {
                // Store current summary type to preserve it
                const preservedSummaryType = currentSummaryType;
                selectChapter(chaptersData[newIndex].id);
                
                // Restore the summary type after chapter selection
                if (chaptersData[newIndex].summaries[preservedSummaryType]) {
                    selectSummaryType(preservedSummaryType);
                }
            }
        }
        
        // Touch/swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        
        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            const swipeDistance = touchEndX - touchStartX;
            
            if (Math.abs(swipeDistance) > swipeThreshold) {
                if (swipeDistance > 0) {
                    // Swipe right - go to previous chapter
                    navigateChapter(-1);
                } else {
                    // Swipe left - go to next chapter
                    navigateChapter(1);
                }
            }
        }
        
        // Enhanced Audio Features
        function initializeAudioVisualizer() {
            const visualizer = document.getElementById('audioVisualizer');
            if (!visualizer) return;
            
            visualizer.innerHTML = '';
            visualizerBars = [];
            
            // Create 20 audio bars
            for (let i = 0; i < 20; i++) {
                const bar = document.createElement('div');
                bar.className = 'audio-bar';
                bar.style.height = '5px';
                visualizer.appendChild(bar);
                visualizerBars.push(bar);
            }
        }
        
        function updateAudioVisualizer() {
            if (!visualizerBars.length || !currentAudio || currentAudio.paused) {
                visualizerBars.forEach(bar => {
                    bar.style.height = '5px';
                    bar.classList.remove('active');
                });
                return;
            }
            
            // Simulate audio frequency data for visualizer
            visualizerBars.forEach((bar, index) => {
                const height = Math.random() * 25 + 5;
                bar.style.height = height + 'px';
                bar.classList.add('active');
                
                // Make some bars more active based on audio progress
                if (Math.random() > 0.7) {
                    bar.style.height = (height * 1.5) + 'px';
                }
            });
        }
        
        function setSleepTimer(minutes) {
            // Clear existing timer
            if (sleepTimer) {
                clearInterval(sleepTimer);
                sleepTimer = null;
            }
            
            // Update button states
            document.querySelectorAll('.sleep-timer-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            if (minutes === 0) {
                sleepTimeRemaining = 0;
                document.getElementById('sleepTimerDisplay').textContent = 'Off';
                return;
            }
            
            // Set new timer
            sleepTimeRemaining = minutes * 60; // Convert to seconds
            event.target.classList.add('active');
            
            sleepTimer = setInterval(() => {
                sleepTimeRemaining--;
                const mins = Math.floor(sleepTimeRemaining / 60);
                const secs = sleepTimeRemaining % 60;
                document.getElementById('sleepTimerDisplay').textContent = 
                    `${mins}:${secs.toString().padStart(2, '0')}`;
                
                if (sleepTimeRemaining <= 0) {
                    // Timer finished - pause audio and clear timer
                    if (currentAudio && !currentAudio.paused) {
                        currentAudio.pause();
                        updatePlayPauseButton();
                    }
                    setSleepTimer(0);
                }
            }, 1000);
        }
        
        function jumpToPercentage(percentage) {
            if (!currentAudio || !currentAudio.duration) return;
            
            const newTime = (currentAudio.duration * percentage) / 100;
            currentAudio.currentTime = newTime;
            updateAudioProgress();
        }
        
        function addCustomBookmark() {
            if (!currentAudio || !currentChapter) return;
            
            const currentTime = currentAudio.currentTime;
            const chapterId = currentChapter.id;
            
            if (!audioBookmarks[chapterId]) {
                audioBookmarks[chapterId] = [];
            }
            
            const bookmark = {
                time: currentTime,
                label: `${Math.floor(currentTime / 60)}:${Math.floor(currentTime % 60).toString().padStart(2, '0')}`,
                timestamp: Date.now()
            };
            
            audioBookmarks[chapterId].push(bookmark);
            localStorage.setItem('audioBookmarks_' + bookId, JSON.stringify(audioBookmarks));
            
            // Show notification
            const container = document.getElementById('audioPlayerContainer');
            const notification = document.createElement('div');
            notification.className = 'audio-error';
            notification.style.background = '#e8f5e8';
            notification.style.color = '#2d5d2d';
            notification.style.border = '1px solid #7a9a7e';
            notification.textContent = `Bookmark added at ${bookmark.label}`;
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
            
            updateBookmarkDisplay();
        }
        
        function updateBookmarkDisplay() {
            const bookmarksContainer = document.getElementById('audioBookmarks');
            if (!bookmarksContainer || !currentChapter) return;
            
            const chapterId = currentChapter.id;
            const chapterBookmarks = audioBookmarks[chapterId] || [];
            
            // Find existing custom bookmarks container or create one
            let customContainer = bookmarksContainer.querySelector('.custom-bookmarks');
            if (!customContainer && chapterBookmarks.length > 0) {
                customContainer = document.createElement('div');
                customContainer.className = 'custom-bookmarks';
                customContainer.style.marginTop = '8px';
                customContainer.style.paddingTop = '8px';
                customContainer.style.borderTop = '1px solid var(--border-color)';
                bookmarksContainer.appendChild(customContainer);
            }
            
            if (customContainer) {
                if (chapterBookmarks.length > 0) {
                    customContainer.innerHTML = '<div style="font-size: 0.75rem; margin-bottom: 4px; color: var(--text-secondary);">Custom Bookmarks:</div>';
                    
                    chapterBookmarks.forEach((bookmark, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'bookmark-btn';
                        btn.textContent = bookmark.label;
                        btn.onclick = () => {
                            if (currentAudio) {
                                currentAudio.currentTime = bookmark.time;
                                updateAudioProgress();
                            }
                        };
                        
                        // Add delete functionality on right-click
                        btn.oncontextmenu = (e) => {
                            e.preventDefault();
                            if (confirm(`Delete bookmark at ${bookmark.label}?`)) {
                                audioBookmarks[chapterId].splice(index, 1);
                                if (audioBookmarks[chapterId].length === 0) {
                                    delete audioBookmarks[chapterId];
                                }
                                localStorage.setItem('audioBookmarks_' + bookId, JSON.stringify(audioBookmarks));
                                updateBookmarkDisplay();
                            }
                        };
                        
                        customContainer.appendChild(btn);
                    });
                } else {
                    customContainer.remove();
                }
            }
        }
        
        function markChapterAsPlaying(chapterId) {
            // Remove playing state from all chapters
            document.querySelectorAll('.chapter-item').forEach(item => {
                item.classList.remove('playing', 'chapter-playing');
            });
            
            // Add playing state to current chapter
            const chapterIndex = chaptersData.findIndex(c => c.id === chapterId);
            if (chapterIndex >= 0) {
                const chapterElements = document.querySelectorAll('.chapter-item');
                if (chapterElements[chapterIndex]) {
                    chapterElements[chapterIndex].classList.add('playing', 'chapter-playing');
                }
            }
        }
        
        function clearChapterPlaying() {
            document.querySelectorAll('.chapter-item').forEach(item => {
                item.classList.remove('playing', 'chapter-playing');
            });
        }
        
        // Audio visualizer is now integrated into the main updateProgress function
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
