        "html": "<p>Chapter 10 Summary: TSH Isn\u2019t a Magic Bullet</p>\n<p>Key Ideas\n- TSH is superb for diagnosing hypothyroidism, but not a foolproof measure of treatment success when using T4 alone.\n- The core mechanism: T4 is converted to T3 inside the pituitary by D2, and this local T3 suppresses TSH. This is why T4 can strongly influence TSH regulation.\n- D2 is a short-lived enzyme. Each conversion of T4 to T3 triggers its tagging for destruction; this self-limiting system helps prevent excessive T3 production.\n- Tagging vs. untagging of D2 is organ-specific. In the pituitary/hypothalamus, untagging is relatively robust, allowing continued T3 production and TSH suppression even when T4 rises. In other organs, tagging is more efficient, limiting T3 production from rising T4.\n- This creates a disconnect: normalizing TSH with T4 therapy does not guarantee normal circulating or tissue T3 levels, leading to persistent metabolic symptoms in some patients.\n- The D2 system is regulated by cellular energy and the proteasome pathway. D2 exists in a dynamic cycle of tagging (destruction) and untagging (rescue), with organ-specific balance.\n- The concept of \u201cunbalance\u201d explains why TSH can look normal while T3 remains suboptimal in patients on T4: central D2 activity (pituitary) behaves differently from peripheral D2 activity (rest of body).\n- Historical studies (Silva &amp; Larsen; Hershman; Geffner) established that pituitary conversion of T4 to T3 is central to TSH regulation, shaping current clinical practice.\n- The practical takeaway: measuring TSH alone is insufficient for assessing hypothyroidism treatment efficacy; preserving or achieving adequate T3 levels is crucial for real-world health and energy.\n- The chapter signals a shift toward T3-focused thinking and the need to consider T3 status in managing hypothyroidism.</p>\n<p>Golden Nuggets (insightful quotes/concepts)\n- \u201cTSH Isn\u2019t a Magic Bullet.\u201d\n- \u201cT4 is converted to T3 inside the pituitary gland, and that is why T4 can be so important in the mechanism that regulates TSH secretion.\u201d\n- \u201cD2 is short lived\u2026 every fifty minutes, half of all D2 is gone and more needs to be made.\u201d\n- \u201cTagged D2 is destroyed\u2026 untagging rescues D2 from destruction.\u201d\n- \u201cIn the pituitary, tagging is inefficient and untagging is present, so T4-to-T3 conversion drives TSH suppression effectively even with rising T4.\u201d\n- \u201cThere can be a disconnect between TSH normalization and circulating T3 normalization when using T4 alone.\u201d\n- \u201cPreserving T3 levels is challenging, which has consequences for the treatment of hypothyroidism.\u201d\n- \u201cThe brain area that controls TSH secretion contains the D2 untagging machinery.\u201d\n- \u201cD2 tagging can be reversible; untagging rescues it and reactivates T3 production.\u201d</p>\n<p>Practical and Applicable\n- For clinicians:\n  - Don\u2019t rely on TSH alone to judge treatment success. Include free T3 (and ideally total or free T4) and assess patient symptoms.\n  - If a patient on T4 has normalized TSH but persistent symptoms (fatigue, weight gain, etc.), evaluate free T3. A low T3 despite normal TSH suggests inadequate peripheral T3 production.\n  - Consider a T4/T3 combination approach (e.g., add liothyronine) when T3 remains suboptimal and symptoms persist; titrate carefully to avoid hyperthyroid symptoms.\n  - Individualize therapy: recognize that central (pituitary) D2 activity may normalize TSH at lower-than-ideal tissue T3 levels; adjust treatment accordingly.\n  - Use a holistic assessment that includes clinical signs and metabolic health, not just biomarkers.\n- For patients:\n  - If symptoms persist despite a normal-looking TSH on thyroid medication, ask your clinician to check free T3 and discuss whether a T4-only regimen is truly addressing tissue-level needs.\n  - Discuss potential benefits and risks of adding T3 (liothyronine) to your regimen and what monitoring would look like.\n- For researchers/practitioners:\n  - Consider organ-specific D2 dynamics when evaluating thyroid therapies.\n  - Explore strategies that preserve central T3 production while improving peripheral T3 availability.\n  - Acknowledge the evolving paradigm: moving from \u201cTSH as gold standard\u201d to balancing T3 as a primary target in treatment.</p>\n<p>Paradigms and Thinking Models Introduced\n- Mechanistic endocrinology: TSH regulation is driven by intracellular deiodination (D2) and local T3 production, not just circulating hormone levels.\n- Organ-specific regulation: D2 tagging/untagging differs by tissue, leading to different T3 outcomes in the pituitary versus peripheral tissues.\n- Biomarker vs. tissue health: TSH can reflect pituitary regulation well but may misrepresent systemic tissue T3 status.\n- Dynamic enzyme regulation: D2 has a built-in life cycle (short half-life, tagging for destruction with every T4\u2192T3 conversion) that acts as a regulatory brake on T3 production.\n- Central-peripheral dichotomy: The pituitary/hypothalamus can maintain T3 production with less tagging, while other organs reduce T3 production as T4 rises.\n- Reversibility of regulation: D2 tagging is potentially reversible via untagging proteins, introducing a tunable aspect to hormone production.\n- Evolution of treatment philosophy: The chapter advocates shifting from TSH-centric management to T3-aware management to optimize overall metabolic health.</p>\n<p>Actionable steps (quick reference)\n- Clinician checklist when managing hypothyroidism:\n  - Baseline and follow-up labs: TSH, free T4, free or total T3; correlate with symptoms.\n  - If stable TSH but persistent symptoms, check free T3; consider adjusting regimen to raise tissue T3 (e.g., add T3).\n  - If T3 is high or symptoms suggest over-treatment, adjust T4 dose downward and reassess.\n  - Consider patient-specific factors (energy, weight, cholesterol, cognitive symptoms) to guide therapy beyond TSH normalization.\n- Patient-facing actions:\n  - Request a T3 assessment if symptoms persist after achieving normal TSH on T4.\n  - Have a discussion about the potential benefits/risks of adding T3 to your regimen.\n  - Track energy, mood, weight, and metabolic health as part of therapy evaluation.\n- Research/clinical guidance:\n  - Develop protocols that routinely include T3 in monitoring for hypothyroidism management.\n  - Investigate organ-specific D2 dynamics in diverse patient populations to inform personalized treatment plans.</p>\n<p>Overall, the chapter argues that while TSH is indispensable for diagnosing hypothyroidism, it is not a sufficient proxy for treatment efficacy when using T4 alone. Understanding the D2-mediated T4\u2192T3 conversion\u2014especially the central vs peripheral differences and the tagging/untagging regulation\u2014explains why patients can have normal TSH but suboptimal T3 and ongoing symptoms. This supports a shift toward T3-aware management and, where appropriate, combination T4/T3 therapy to better preserve tissue-level thyroid action across the body.</p>",

nitoring would look like.\n- For researchers/practitioners:\n  - Consider organ-specific D2 dynamics when evaluating thyroid therapies.\n  - Explore strategies that preserve central T3 production while improving peripheral T3 availability.\n  - Acknowledge the evolving paradigm: moving from \u201cTSH as gold standard\u201d to balancing T3 as a primary target in treatment.\n\nParadigms and Thinking Models Introduced\n- Mechanistic endocrinology: TSH regulation is driven by intracellular deiodination (D2) and local T3 production, not just circulating hormone levels.\n- Organ-specific regulation: D2 tagging/untagging differs by tissue, leading to different T3 outcomes in the pituitary versus peripheral tissues.\n- Biomarker vs. tissue health: TSH can reflect pituitary regulation well but may misrepresent systemic tissue T3 status.\n- Dynamic enzyme regulation: D2 has a built-in life cycle (short half-life, tagging for destruction with every T4\u2192T3 conversion) that acts as a regulatory brake on T3 production.\n- Central-peripheral dichotomy: The pituitary/hypothalamus can maintain T3 production with less tagging, while other organs reduce T3 production as T4 rises.\n- Reversibility of regulation: D2 tagging is potentially reversible via untagging proteins, introducing a tunable aspect to hormone production.\n- Evolution of treatment philosophy: The chapter advocates shifting from TSH-centric management to T3-aware management to optimize overall metabolic health.\n\nActionable steps (quick reference)\n- Clinician checklist when managing hypothyroidism:\n  - Baseline and follow-up labs: TSH, free T4, free or total T3; correlate with symptoms.\n  - If stable TSH but persistent symptoms, check free T3; consider adjusting regimen to raise tissue T3 (e.g., add T3).\n  - If T3 is high or symptoms suggest over-treatment, adjust T4 dose downward and reassess.\n  - Consider patient-specific factors (energy, weight, cholesterol, cognitive symptoms) to guide therapy beyond TSH         "html": "<p>Here is a concise, structured summary of Chapter 11: Missing Clues and T3.</p>\n<p>Key Ideas\n- T3 is the active thyroid hormone and a primary driver of symptom resolution in hypothyroidism; T4\u2019s main purpose is to normalize TSH, not necessarily T3.\n- Historically, multiple studies since the 1970s showed lower circulating T3 in patients treated with T4, yet the medical community largely did not connect this to residual symptoms or treatment adequacy.\n- The body actively defends circulating T3 levels. The brain relies on local T3 production via the D2 enzyme, so brain T3 does not mirror blood T3.\n- TSH normalization by T4 does not guarantee normalization of T3; this mismatch can leave tissues under-activated (metabolic effects) or brain function affected (cognition, mood) despite normal TSH.\n- Deiodinases (D1, D2) and thyroid adaptations were shown to be more flexible than previously thought; when peripheral conversion is disrupted, the thyroid and other systems adjust to preserve T3 in circulation.\n- Evolutionary context: iodine deficiency shaped a system geared to preserve T3; artificially elevating T4 through standard treatment disrupts a system not evolved to handle excess T4.\n- Large-scale data now consistently show lower T3 in T4-treated patients with normal TSH, raising the possibility of a mild, persistent hypothyroid state in many tissues.\n- Clinical guidelines historically underemphasized T3, often citing limited data; more recent guidelines still rely on a single study and miss broader evidence showing T3 non-normalization.\n- The relationship between circulating T3 and symptoms is complex: cognitive/quality-of-life symptoms relate more to brain D2 function and local T3 in the brain, whereas metabolic symptoms relate more to circulating T3 affecting multiple organs.\n- Classic trials (e.g., Ridgway et al.) demonstrated organ-specific responses to T3, with different tissues requiring different T3 levels for normalization of function.\n- The takeaway is that T4 monotherapy is not truly physiological; preserving T3 levels appears to be a fundamental objective of thyroid physiology, and treatment should consider T3 status.</p>\n<p>Golden Nuggets\n- \u201cT3 is the active thyroid hormone that resolves symptoms of hypothyroidism.\u201d\n- \u201cThe body adjusts T3 production to defend T3 levels.\u201d\n- \u201cThe brain, the pituitary gland, and the thyroid gland are hardwired to defend and preserve T3 levels.\u201d\n- \u201cT4-treated patients have about 10\u201315% lower circulating T3 levels.\u201d\n- \u201cPreserving T3 levels is a priority for the thyroid system.\u201d\n- \u201cThe discovery that the thyroid\u2019s primary directive is to sustain normal T3 levels in the circulation.\u201d\n- \u201cResearch is 90% failure and 10% success.\u201d\n- \u201cNormalization of TSH with T4 is not the same as normalization of T3.\u201d\n- \u201cIn the brain, most T3 is produced locally via D2; circulating T3 does not reflect brain T3.\u201d\n- \u201cT4 alone is not physiologic when the system evolved to defend T3 levels against iodine deficiency.\u201d</p>\n<p>Practical and Applicable\n- For clinicians:\n  - Consider measuring circulating T3 in patients on T4 therapy who have persistent symptoms despite normal TSH and T4.\n  - Communicate to patients that a normal TSH does not guarantee normal tissue T3; discuss the potential role of T3 supplementation or combination therapy in selected cases.\n  - Recognize organ-specific responses: improvements in heart/muscle may occur at lower T3, while metabolic rate and cholesterol may require higher T3 exposure; tailor expectations and monitoring accordingly.\n  - Be aware of measurement issues: conventional T3 assays can be imprecise, especially at the extremes. Consider more robust or integrated assessments of T3 (e.g., multiple measurements or 24-hour integrated T3 levels) when feasible.\n- For patients:\n  - If on T4 monotherapy with residual symptoms (weight, cholesterol, energy, mood), discuss the possibility that T3 may be suboptimal and explore clinician-supported options.\n  - Ask about how symptoms correlate with meals, weight changes, and energy patterns, recognizing that brain symptoms may reflect local T3 in the brain rather than circulating T3.\n- For researchers and trial design:\n  - When studying T3\u2019s impact, plan for 24-hour integrated T3 measurements to capture fluctuations and better relate T3 exposure to outcomes.\n  - Design larger, longer-term studies to assess whether adjusting T3 (via combination therapy or optimized T4 dosing that preserves T3) improves metabolic and cognitive endpoints.\n- For guidelines and practice:\n  - Reassess the emphasis on TSH normalization as a proxy for adequate thyroid replacement; acknowledge evidence that T3 levels can remain suboptimal on T4 and contribute to residual symptoms.\n  - Consider including guidance on monitoring T3 status and discussing potential benefits/risks of combination therapy in appropriate patients.</p>\n<p>Paradigms and Thinking Models\n- T3-centric vs. T4-centric paradigm: The chapter challenges the traditional focus on TSH normalization alone and argues for T3 homeostasis as a fundamental goal.\n- Deiodinase biology as a regulatory system: D1 and D2 (and brain-specific D2) act as dynamic, adaptive controls that defend circulating T3; their function reveals organ-specific hormone availability beyond what blood tests alone show.\n- Evolutionary systems thinking: The thyroid system evolved to preserve T3 in the context of iodine deficiency; artificially elevating T4 disrupts a balance that has adapted over millions of years.\n- Brain-centric vs. peripheral measures: Cognitive/mood symptoms depend heavily on brain-specific T3 (via D2) rather than circulating T3, while metabolic symptoms depend more on systemic T3; this decoupling explains why circulating T3 is not a perfect proxy for all clinical outcomes.\n- Evidence synthesis and guideline gaps: The chapter demonstrates how a few influential studies can shape guidelines, sometimes at the expense of broader evidence. It emphasizes integrating diverse datasets (clinical trials, cohort studies, and animal models) to inform practice.\n- Causality vs. correlation in endocrine physiology: The presence of residual symptoms does not map straightforwardly to circulating T3 levels due to multiple covariates (diet, weight loss, measurement variability, brain D2 activity), necessitating nuanced interpretation.\n- Experimental falsification and learning: The D1/D2 knockout experiments produced unexpected results (normal circulating T3 despite dual deiodinase loss), illustrating the value of challenging assumptions and revising models accordingly.</p>\n<p>If you\u2019d like, I can tailor this into a one-page study guide for quick reference or convert it into a slide-ready outline for a presentation.</p>",

pter demonstrates how a few influential studies can shape guidelines, sometimes at the expense of broader evidence. It emphasizes integrating diverse datasets (clinical trials, cohort studies, and animal models) to inform practice.\n- Causality vs. correlation in endocrine physiology: The presence of residual symptoms does not map straightforwardly to circulating T3 levels due to multiple covariates (diet, weight loss, measurement variability, brain D2 activity), necessitating nuanced interpretation.\n- Experimental falsification and learning: The D1/D2 knockout experiments produced unexpected results (normal circulating T3 despite dual deiodinase loss), illustrating the value of challenging assumptions and revising models accordingly.\n\nIf you\u2019d like, I can tailor this into a one-page study guide for quick reference or convert it into a slide-ready outline for a presentation."

        "html": "<p>Here is a concise, structured summary of Chapter 12: There Is More to Hypothyroidism Than Just Low T3 Levels.</p>\n<p>Key Ideas\n- Residual symptoms on T4 therapy often reflect more than just low T3; a \u201ctwo-hit\u201d framework is common: underlying low T3 plus other factors (stress, perimenopause, autoimmune activity, nutritional issues) overwhelm compensatory capacity.\n- Brain thyroid hormone action is largely determined by local T3 production via the D2 deiodinase pathway; brain T3 is not adequately inferred from circulating T3 alone.\n- A significant proportion of people carry a D2 gene polymorphism that slows T3 production in the brain, which can worsen psychological well-being and mood and predict better response to T4+T3 therapy.\n- Polymorphic D2 can lead to brain-specific hypothyroidism, affecting areas tied to decision-making (prefrontal cortex), motivation (striatum), and memory (hippocampus).\n- Animal and human studies show that D2 polymorphism causes cognitive and behavioral changes that resemble hypothyroid brain dysfunction; these can be reversed with T3 or combination T4+T3 therapy.\n- Misfolding of the polymorphic D2 protein causes cellular stress and mislocalization to the Golgi apparatus, linking genetic variation to cellular dysfunction and brain effects.\n- The D2 story is complemented by D1 pathway findings and other genetic variants that may impair T4-to-T3 conversion; combined defects can exacerbate low-T3 effects.\n- Autoimmune comorbidity (Hashimoto\u2019s and related conditions) can drive cognitive symptoms independently of thyroid hormone levels, including Hashimoto\u2019s encephalopathy and brain hypoperfusion or altered brain metabolites.\n- B12 deficiency, common in Hashimoto\u2019s due to atrophic gastritis and pernicious anemia, can produce cognitive symptoms that mimic hypothyroidism; addressing these gaps is crucial.\n- Genetic and population differences matter; associations between D2 polymorphism and disease outcomes vary by ethnicity, underscoring the need for personalized interpretation.\n- The clinician\u2019s job is to recognize that successful T4 therapy depends on the deiodinases; for some patients, combination therapy or broader evaluation is required.\n- The chapter frames hypothyroidism treatment as a multi-factor problem, not just a hormone quantity issue, and points toward more nuanced, personalized approaches.</p>\n<p>Golden Nuggets\n- \u201cTwo-hit phenomenon\u201d explains why some patients on T4 still feel hypothyroid: low T3 plus other stressors exhaust compensatory mechanisms.\n- Brain relies on locally produced T3 via D2; thus, normal circulating T3 may not guarantee normal brain thyroid function.\n- D2 polymorphism can produce about 20% less T3, which helps explain cognitive and mood symptoms in T4-treated patients.\n- Polymorphic D2 mice show reduced activity, increased sleep, altered exploratory behavior, and impaired short-term memory that can be reversed with T3.\n- Combination therapy (T4 + T3) can fix residual brain-related symptoms in the presence of D2 polymorphism or related defects.\n- Misfolded D2 accumulates in the Golgi apparatus, causing cellular stress and impaired function\u2014linking a genetic change to cellular and brain-level effects.\n- Hashimoto\u2019s encephalopathy illustrates that autoimmune processes can drive cognitive symptoms independent of thyroid hormone levels.\n- B12 deficiency and other low-grade autoimmune conditions can produce brain-related symptoms that masquerade as or compound hypothyroid symptoms.</p>\n<p>Practical and Applicable\n- For patients with persistent symptoms on T4:\n  - Systematically assess for non-thyroid contributors: perimenopausal/stress factors, depression, sleep problems, vitamin B12 deficiency, anemia, and nutritional shortages.\n  - Screen for autoimmune comorbidities (e.g., Hashimoto\u2019s) and evaluate for Hashimoto\u2019s encephalopathy if cognitive symptoms are prominent.\n  - Check B12 levels and consider atrophic gastritis/pernicious anemia workup; treat deficiencies.\n  - Discuss and consider T4+T3 combination therapy when appropriate, especially if D2-related brain T3 production is likely impaired and symptoms persist on T4 alone.\n- Consider targeted workup when residual symptoms are present:\n  - Cognitive and mood assessments to characterize brain-related symptoms.\n  - If available, genetic testing for D2/D1 polymorphisms to inform therapy choices (interpret with caution; population-specific effects exist).\n  - Evaluate for other factors that impair T3 brain availability (autoimmune activity, inflammation, nutritional status).\n- Manage holistically:\n  - Address chronic stress, sleep quality, and menopausal symptoms to reduce the \u201ctwo-hit\u201d burden.\n  - Support intellectual engagement and lifelong learning to promote cognitive reserve (intellectual enrichment).\n- When discussing surgical options (e.g., thyroid nodules), inform patients that T4 therapy alone may not normalize brain T3 in a subset of patients.\n- For clinicians and researchers across disciplines: adopt a multi-factorial, systems-based approach rather than attributing symptoms to thyroid hormone levels alone; consider deiodinase biology and tissue-specific hormone action in treatment planning.</p>\n<p>Paradigms and Thinking Models\n- Two-Hit Model: residual cognitive symptoms arise from a combination of low brain T3 and additional stressors (autoimmune activity, menopausal changes, nutritional deficits).\n- Local Production Paradigm: brain T3 mainly comes from local D2 activity; circulating T3 is not sufficient to gauge brain thyroid status.\n- Deiodinase Hierarchy Model: D2 is the primary driver of brain T3 production; D1 plays a smaller, secondary role; defects in either can compound symptoms.\n- Genetic-Variability Personalized Medicine: D2 and D1 polymorphisms influence treatment response; therapy may need to be tailored to genetic makeup where feasible. ize needed to detect meaningful effects.\n- Treat-to-Target (T2T): emphasizes achieving and maintaining specific clinical targets (e.g., normalized TSH) while balancing patient-reported outcomes.\n- Patient-Centered Care and Shared Decision-Making: places patient preferences and quality-of-life considerations at the heart of treatment choices.\n- Patient-Reported Outcomes (PROs) vs. Clinician-Reported Outcomes: acknowledges that QoL and mood are subjective and may require nuanced measurement approaches.\n- Real-World Evidence vs. RCTs: observational data can reveal lifestyle and demographic factors (e.g., nature connectedness, diet) that influence treatment outcomes, even if causality is not proven.\n- The \"Wrong Questions\" Principle: prompts investigators to design studies that capture what truly matters to patients, not only what is easily measurable.\n- Natural vs. Synthetic Therapies: a cultural and lifestyle paradigm that can influence adherence and satisfaction, even when clinical outcomes are similar.</p>\n<p>Next steps (in context of the chapter)\n- The author indicates that the next chapter will present the first double-blind randomized trial comparing T4, T4 + T3, and thyroid extract to address these questions more definitively.</p>\n<p>If you\u2019d like, I can tailor this into a compact one-page summary or convert these points into a quick-reference cheat sheet for clinicians.</p>",

        "html": "<p>Here is a concise, structured summary of Chapter 14: Embracing Options.</p>\n<p>Key Ideas\n- 2014 ATA guidelines shift toward science-informed clinical care, acknowledging residual symptoms on T4, low T3 levels, and the potential value of T4 + T3 therapy for certain patients.\n- Combination therapy is not a universal fix; it should be considered on a trial basis for the roughly 10\u201320% of patients who remain symptomatic on T4.\n- Past clinical trials likely underdetected benefits because they enrolled many patients who did well on T4, diluting any effect of adding T3.\n- Patient and physician surveys revealed widespread dissatisfaction with T4-only therapy, catalyzing broader consideration of T4 + T3.\n- Case evidence (including a well-conducted double-blind crossover study) shows symptomatic patients on T4 + T3 can experience meaningful improvements in quality of life and cognitive function.\n- Practical trial design: future trials should enroll more symptomatic patients and control for variables (age, sex, genetics) to detect real benefits.\n- Clinical approach: start most patients on T4; if residual symptoms persist after thorough evaluation, discuss and potentially initiate T4 + T3 with careful monitoring.\n- Safety and patient selection: avoid combination therapy in pregnancy, children, or people with cardiac conditions without specialist input; balance risks and benefits with patient values.\n- Operational guidance: two separate tablets (T4 and T3) provide dose-flexibility; monitor symptoms and TSH, adjust gradually, and use frequent follow-ups early in the transition.\n- Real-world execution: rely on a thoughtful initiation protocol (as summarized by experts like Wilmar Wiersinga), prioritize patient education, and cultivate a collaborative doctor-patient relationship.</p>\n<p>Golden Nuggets\n- \"Combination therapy with T4 + T3 is not a panacea and should not be used as a routine approach to patients with hypothyroidism.\"\n- \"Only some patients on T4 therapy remain symptomatic... these are the ones who respond positively to and prefer either form of combination therapy.\"\n- \"The inclusion of patients who do well on T4 in past clinical trials diluted the effects of combination therapy.\"\n- \"Enrich our study population with patients who did not benefit fully from T4.\"\n- \"If you have residual symptoms, you need to take action. Start by educating yourself, discussing the issue with your family, and talking to your doctor.\"\n- \"Using two separate tablets gives me the ability to adjust the dose of each hormone while monitoring two important and equally critical things: residual symptoms and TSH levels.\"\n- \"The doctor-patient relationship is key for you getting better; find a doctor who listens and is willing to help.\"\n- \"About half the patients with residual symptoms will respond to combination therapy; the other half will remain symptomatic. If no improvement, revert to T4 alone.\"\n- \"Adjustments every six weeks; aim to keep TSH within the normal range while reducing residual symptoms.\"</p>\n<p>Practical and Applicable\n- For patients with residual hypothyroid symptoms on T4:\n  - Discuss T4 + T3 as a trial with your doctor; gather old records (diagnosis TSH, TPO antibodies) and rule out other conditions (menopause, other autoimmune diseases).\n  - If proceeding, use a cautious starting switch:\n    - From 100 mcg T4: 87.5 mcg T4 + 5 mcg T3 daily\n    - From 150 mcg T4: 125 mcg T4 + 7.5 mcg T3 daily\n    - From 200 mcg T4: 175 mcg T4 + 10 mcg T3 daily\n  - Split the daily T3 dose into two administrations (one in the morning, one at night); if doses differ, place the larger dose at night to respect circadian T3 rhythm.\n  - Consider measuring T3 levels if needed: fasting morning and about 3 hours after a T3 dose.\n  - Aim to keep TSH in the normal range while reducing residual symptoms; adjust T4 downward as T3 increases.\n  - Schedule follow-ups every 3\u20134 months initially; typical dose adjustments every ~6 weeks as equilibrium is reached.\n  - If response is inadequate after adjustments, revert to T4 alone and re-evaluate for other conditions; consider lifestyle approaches (rest, diet, exercise) as complementary support.\n- Safety and patient selection:\n  - Avoid starting combination therapy in patients with known cardiac disease, and avoid in pregnancy or children without specialist input.\n  - Use two separate tablets to allow independent titration of T4 and T3 and better control of symptoms and TSH.\n- Practical execution tips:\n  - Identify a doctor experienced with current guidelines; telemedicine can help; bring old records and a clear plan with milestones.\n  - If possible, use a structured initiation template (e.g., the Wiersinga approach) to guide dose conversions and split dosing.\n  - Build a support system with family and friends; acknowledge that symptoms may affect energy, memory, and productivity, and communicate these needs to your circle.\n- Monitoring and follow-up:\n  - Regular Thyroid function tests and symptom reviews are essential during transition.\n  - Expect a trial period of weeks to months before clear improvement; adjust every 6 weeks as needed.\n  - If no improvement after reasonable trials, revert to T4 and explore other contributing conditions or approaches.</p>\n<p>Paradigms and Thinking Models\n- Patient-centered evidence: prioritizing patient-reported symptoms and quality of life alongside lab values; recognizing that TSH alone is not the full story.\n- Stratified trial design: focusing on symptomatic patients to detect meaningful benefits of T4 + T3, rather than studying a broad, heterogeneous population.\n- Dynamic guidelines: guidelines evolve in response to new data and patient experiences; clinicians should adapt practice accordingly.\n- N-of-1 personalization: tailoring therapy to the individual\u2019s response (symptoms and TSH) rather than applying a one-size-fits-all dose.\n- Safety-first iterative optimization: begin with conservative changes, monitor closely, and adjust to maintain normal TSH and patient safety.\n- Holistic problem-solving: consider coexisting conditions (menopause, autoimmune diseases) and lifestyle factors as part of the therapeutic plan.</p>\n<p>Quick Takeaway\nFor many patients with hypothyroidism who remain symptomatic on T4, a carefully managed trial of T4 + T3 can offer meaningful relief. The decision should be personalized, evidence-informed, and conducted with rigorous monitoring, clear patient-doctor communication, and a plan that prioritizes both symptom relief and maintaining normal TSH.</p>",

ts on T4 therapy remain symptomatic... these are the ones who respond positively to and prefer either form of combination therapy.\"\n- \"The inclusion of patients who do well on T4 in past clinical trials diluted the effects of combination therapy.\"\n- \"Enrich our study population with patients who did not benefit fully from T4.\"\n- \"If you have residual symptoms, you need to take action. Start by educating yourself, discussing the issue with your family, and talking to your doctor.\"\n- \"Using two separate tablets gives me the ability to adjust the dose of each hormone while monitoring two important and equally critical things: residual symptoms and TSH levels.\"\n- \"The doctor-patient relationship is key for you getting better; find a doctor who listens and is willing to help.\"\n- \"About half the patients with residual symptoms will respond to combination therapy; the other half will remain symptomatic. If no improvement, revert to T4 alone.\"\n- \"Adjustments every six weeks; aim to keep TSH within the normal range while reducing residual symptoms.\"\n\nPractical and Applicable\n- For patients with residual hypothyroid symptoms on T4:\n  - Discuss T4 + T3 as a trial with your doctor; gather old records (diagnosis TSH, TPO antibodies) and rule out other conditions (menopause, other autoimmune diseases).\n  - If proceeding, use a cautious starting switch:\n    - From 100 mcg T4: 87.5 mcg T4 + 5 mcg T3 daily\n    - From 150 mcg T4: 125 mcg T4 + 7.5 mcg T3 daily\n    - From 200 mcg T4: 175 mcg T4 + 10 mcg T3 daily\n  - Split the daily T3 dose into two administrations (one in the morning, one at night); if doses differ, place the larger dose at night to respect circadian T3 rhythm.\n  - Consider measuring T3 levels if needed: fasting morning and about 3 hours after a T3 dose.\n  - Aim to keep TSH in the normal range while reducing residual symptoms; adjust T4 downward as T3 increases.\n  - Schedule follow-ups every 3\u20134 months initially; typical dose adjustments every ~6 weeks as equilibrium is reached.\n  - If response is inadequate after adjustments, revert to T4 alone and re-evaluate for other conditions; consider lifestyle approaches (rest, diet, exercise) as complementary support.\n- Safety and patient selection:\n  - Avoid starting combination therapy in patients with known cardiac disease, and avoid in pregnancy or children without specialist input.\n  - Use two separate tablets to allow independent titration of T4 and T3 and better control of symptoms and TSH.\n- Practical execution tips:\n  - Identify a doctor experienced with current guidelines; telemedicine can help; bring old records and a clear plan with milestones.\n  - If possible, use a structured initiation template (e.g., the Wiersinga approach) to guide dose conversions and split dosing.\n  - Build a support system with family and friends; acknowledge that symptoms may affect energy, memory, and productivity, and communicate these needs to your circle.\n- Monitoring and follow-up:\n  - Regular Thyroid function tests and symptom reviews are essential during transition.\n  - Expect a trial period of weeks to months before clear improvement; adjust every 6 weeks as needed.\n  - If no improvement after reasonable trials, revert to T4 and explore other contributing conditions or approaches.\n\nParadigms and Thinking Models\n- Patient-centered evidence: prioritizing patient-reported symptoms and quality of life alongside lab values; recognizing that TSH alone is not the full story.\n- Stratified trial design: focusing on symptomatic patients to detect meaningful benefits of T4 + T3, rather than studying a broad, heterogeneous population.\n- Dynamic guidelines: guidelines evolve in response to new data and patient experiences; clinicians should adapt practice accordingly.\n- N-of-1 personalization: tailoring therapy to the individual\u2019s response (symptoms and TSH) rather than applying a one-size-fits-all dose.\n- Safety-first iterative optimization: begin with conservative changes, monitor closely, and adjust to maintain normal TSH and patient safety.\n- Holistic problem-solving: consider coexisting conditions (menopause, autoimmune diseases) and lifestyle factors as part of the therapeutic plan.\n\nQuick Takeaway\nFor many patients with hypothyroidism who remain symptomatic on T4, a carefully managed trial of T4 + T3 can offer meaningful relief. The decision should be personalized, evidence-informed, and conducted with rigorous monitoring, clear patient-doctor communication, and a plan that prioritizes both symptom relief and maintaining normal TSH."

 track residual symptoms systematically.\n- For medical associations and professional societies\n  - Create task forces to define SORSHOT, develop diagnostic algorithms, and craft practical guidelines for clinicians.\n  - Update CME curricula to include SORSHOT awareness, diagnostic approaches, and safe use of T3.\n  - Propose an ICD code for SORSHOT to improve recognition, research, and reimbursement processes.\n- For regulators and industry\n  - Mandate labeling that discloses the limitations of T4, including potential residual symptoms.\n  - Support funding for research into mechanisms of SORSHOT and long-term safety of T3 or thyroid extracts.\n- For researchers\n  - Design trials focusing on patients with SORSHOT to test the effectiveness and safety of T3-based strategies and thyroid extracts.\n  - Investigate mechanistic bases (genetic predisposition, related diseases, low T3 levels) and identify biomarkers for SORSHOT.\n- For patients and caregivers\n  - Engage actively in discussions with clinicians about residual symptoms and potential treatment adjustments.\n  - Seek information on SORSHOT and discuss the risks/benefits of T3 or alternative therapies with providers.</p>\n<p>Paradigms and Thinking Models Introduced\n- Blind-spot awareness and scotoma model\n  - The idea that medical practice can overlook obvious problems due to cognitive biases and entrenched beliefs; recognizing this as a first step to change.\n- Perspective-taking as a tool for scientific progress\n  - Step into patients\u2019 shoes to challenge dogma and re-evaluate assumptions; a practical method to overcome confirmation bias.\n- Patient-centered evidence over dogma\n  - Elevating patient-reported outcomes (quality of life, cognition) alongside traditional biochemical targets when evaluating treatment success.\n- Systemic and policy-oriented thinking\n  - Moving from individual clinician decisions to organized action by medical associations, regulatory bodies, and funding agencies to address a population-level issue.\n- Pragmatic research and iterative testing\n  - Emphasizing iterative trials, labeled as focusing on real-world patient subgroups (like those with SORSHOT), rather than broad, one-size-fits-all studies.\n- Naming and legitimizing a clinical syndrome\n  - Proposing formal recognition (SORSHOT) to legitimize research, diagnosis, and treatment adjustments\u2014an approach that can apply to other chronic conditions with residual symptoms.\n- Evidence-based, safety-conscious evolution\n  - Balancing optimism about new therapies (T3 strategies) with careful consideration of long-term safety and rigorous trials.</p>\n<p>If you\u2019d like, I can tailor this into a condensed slide-ready version or expand any section with precise quotes and citations from the epilogue.</p>",

        "html": "<p>Here is a concise, structured summary of Chapter 1 (as indicated by the Notes section for Chapter 1). The summary focuses on the main ideas, valuable insights, practical takeaways, and the thinking models that appear to underlie the chapter\u2019s themes.</p>\n<ul>\n<li>Key Ideas</li>\n<li>The standard of care for hypothyroidism has long been levothyroxine (LT4) monotherapy, but many patients report persistent symptoms and reduced well-being even when TSH is normal.</li>\n<li>Tissue-level thyroid hormone activity can differ from circulating hormone measures because local conversion of T4 to T3 by deiodinases and tissue-specific factors determine actual cellular thyroid status.</li>\n<li>There is ongoing debate about the sufficiency of LT4 alone; combination therapies (LT4 + LT3) or desiccated thyroid extracts are discussed as potential options for select patients, with evidence and guidelines varying.</li>\n<li>Historical and contemporary debates around drug marketing, bioequivalence, and the pharmaceutical industry influence on thyroid therapy choices (including brand-name vs generic LT4).</li>\n<li>Psychological and cognitive domains are important in thyroid disease: patients may experience mood, cognition, and quality-of-life changes that are not fully captured by standard biochemical targets.</li>\n<li>\n<p>The field blends physiology (deiodinases, T4/T3 physiology) with clinical practice and patient-reported outcomes, highlighting a shift toward more personalized or nuanced management.</p>\n</li>\n<li>\n<p>Golden Nuggets (valuable quotes/concepts to anchor understanding)</p>\n</li>\n<li>Normal TSH does not always equate to euthyroidism in real patients on LT4 monotherapy.</li>\n<li>Levothyroxine monotherapy cannot guarantee euthyroidism for all athyreotic patients.</li>\n<li>Tissue-level activation of thyroid hormone (via deiodinases) is a critical determinant of physiological thyroid status, not just circulating T3/T4 levels.</li>\n<li>Bioequivalence and industry sponsorship can complicate interpretations of thyroid drug effectiveness and safety.</li>\n<li>\n<p>The patient experience, mood, cognition, and overall well-being are essential benchmarks alongside biochemical targets.</p>\n</li>\n<li>\n<p>Practical and Applicable (principles and steps you can use now)</p>\n</li>\n<li>Holistic assessment: For patients on LT4 with persistent symptoms, evaluate beyond TSH. Consider free T4, and where appropriate, free T3 and patient-reported outcomes on mood and cognition.</li>\n<li>Shared decision-making: When symptoms persist, discuss the potential benefits and risks of LT4+LT3 combination therapy or desiccated thyroid extract with the patient, guided by current guidelines and individual circumstances.</li>\n<li>Personalization mindset: Be attentive to tissue-level variability (e.g., potential deiodinase-related differences or polymorphisms) that may influence response to therapy.</li>\n<li>Medication and bioavailability checks: Review concomitant medications and timing that might affect absorption or metabolism of thyroid hormone (e.g., calcium, iron, proton pump inhibitors) and adjust dosing timing as needed.</li>\n<li>Brand/generic transitions: If switching LT4 formulations, re-check TSH in 6\u20138 weeks and monitor patient-reported symptoms closely.</li>\n<li>Psychological well-being as a target: Regularly screen for mood, energy, and cognitive concerns; refer for mental health support when appropriate.</li>\n<li>\n<p>Stay informed on evolving therapies: Keep an eye on emerging slow-release T3 approaches or novel LT4/LT3 formulations and the latest guidelines, as evidence and recommendations continue to evolve.</p>\n</li>\n<li>\n<p>Paradigms and Thinking Models (conceptual lenses in the chapter)</p>\n</li>\n<li>Tissue-level thyroidism paradigm: Emphasizes that tissue exposure to T3 is shaped by local conversion (deiodinases) and not solely by circulating hormone levels; this reframes \u201ceuthyroidism\u201d beyond serum TSH targets.</li>\n<li>Systems biology approach: Views thyroid hormone action as a dynamic, regulated network involving production, deiodination, transport, receptors, and tissue-specific responses across organs.</li>\n<li>Personalization/precision medicine: Recognizes genetic and enzymatic variability (e.g., deiodinase polymorphisms) as factors that influence individual therapy responses and may justify tailored treatment strategies.</li>\n<li>Evidence vs. experience tension: Balances guideline-driven care with patient-reported outcomes and experiences, acknowledging that biochemical targets may not fully capture clinical reality.</li>\n<li>Historical/ethical lens on therapy choices: Considers how historical development, marketing, and regulatory decisions shape current practice and patient outcomes.</li>\n</ul>\n<p>If you\u2019d like, I can tailor this to a specific subtopic (e.g., deiodinase polymorphisms, LT4+LT3 combination therapy, or the marketing/bioequivalence angle) or apply the framework to a different chapter.</p>",

ctiveness and safety.\n  - The patient experience, mood, cognition, and overall well-being are essential benchmarks alongside biochemical targets.\n\n- Practical and Applicable (principles and steps you can use now)\n  - Holistic assessment: For patients on LT4 with persistent symptoms, evaluate beyond TSH. Consider free T4, and where appropriate, free T3 and patient-reported outcomes on mood and cognition.\n  - Shared decision-making: When symptoms persist, discuss the potential benefits and risks of LT4+LT3 combination therapy or desiccated thyroid extract with the patient, guided by current guidelines and individual circumstances.\n  - Personalization mindset: Be attentive to tissue-level variability (e.g., potential deiodinase-related differences or polymorphisms) that may influence response to therapy.\n  - Medication and bioavailability checks: Review concomitant medications and timing that might affect absorption or metabolism of thyroid hormone (e.g., calcium, iron, proton pump inhibitors) and adjust dosing timing as needed.\n  - Brand/generic transitions: If switching LT4 formulations, re-check TSH in 6\u20138 weeks and monitor patient-reported symptoms closely.\n  - Psychological well-being as a target: Regularly screen for mood, energy, and cognitive concerns; refer for mental health support when appropriate.\n  - Stay informed on evolving therapies: Keep an eye on emerging slow-release T3 approaches or novel LT4/LT3 formulations and the latest guidelines, as evidence and recommendations continue to evolve.\n\n- Paradigms and Thinking Models (conceptual lenses in the chapter)\n  - Tissue-level thyroidism paradigm: Emphasizes that tissue exposure to T3 is shaped by local conversion (deiodinases) and not solely by circulating hormone levels; this reframes \u201ceuthyroidism\u201d beyond serum TSH targets.\n  - Systems biology approach: Views thyroid hormone action as a dynamic, regulated network involving production, deiodination, transport, receptors, and                         <button class="audio-control-btn" id="skipForwardBtn" onclick="skipAudio(15)">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
                                <text x="12" y="16" text-anchor="middle" font-size="8" fill="white">15</text>
                            </svg>
                        </button>
                        
                        <button class="audio-control-btn" id="nextChapterBtn" onclick="navigateToChapterAudio(1)">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                            </svg>
                        </button>
                        
                        <div class="audio-progress-container">
                            <div class="audio-progress-bar" id="progressBar" onclick="seekAudio(event)">
                                <div class="audio-progress-fill" id="progressFill"></div>
                                <div class="audio-progress-handle" id="progressHandle"></div>
                            </div>
                            <div class="audio-time-display">
                                <span id="currentTime">0:00</span>
                                <span id="totalTime">0:00</span>
                            </div>
                        </div>
                        
                        <div class="audio-controls-secondary">
                            <div class="speed-control">
                                <button class="speed-button" onclick="setPlaybackRate(0.5)">0.5x</button>
                                <button class="speed-button" onclick="setPlaybackRate(0.75)">0.75x</button>
                                <button class="speed-button active" onclick="setPlaybackRate(1)">1x</button>
                                <button class="speed-button" onclick="setPlaybackRate(1.25)">1.25x</button>
                                <button class="speed-button" onclick="setPlaybackRate(1.5)">1.5x</button>
                                <button class="speed-button" onclick="setPlaybackRate(2)">2x</button>
                            </div>
                            
                            <div class="volume-control">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                                </svg>
                                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="${currentVolume}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="audio-visualizer" id="audioVisualizer">
                        <!-- Audio bars will be generated by JavaScript -->
                    </div>
                    
                    <div class="audio-metadata">
                        <div><strong>Word Count:</strong> ${audio.word_count || 'Unknown'} words</div>
                        <div><strong>Generated:</strong> ${audio.generation_timestamp ? new Date(audio.generation_timestamp).toLocaleDateString() : 'Unknown'}</div>
                    </div>
                    
                    <div class="chapter-navigation">
                        <span>Chapter Navigation:</span>
                        <div class="auto-advance-toggle">
                            <span>Auto-advance</span>
                            <div class="toggle-switch ${autoAdvance ? 'active' : ''}" id="autoAdvanceToggle" onclick="toggleAutoAdvance()">
                                <div class="toggle-handle"></div>
                            </div>
                        </div>
                        <div class="sleep-timer">
                            <span>Sleep Timer:</span>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(5)">5m</button>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(10)">10m</button>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(15)">15m</button>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(30)">30m</button>
                            <div class="sleep-timer-display" id="sleepTimerDisplay">Off</div>
                        </div>
                    </div>
                    
                    <div class="audio-bookmarks" id="audioBookmarks">
                        <div style="font-size: 0.8rem; margin-bottom: 8px; color: var(--text-secondary);">Quick Bookmarks:</div>
                        <button class="bookmark-btn" onclick="jumpToPercentage(0)">Start</button>
                        <button class="bookmark-btn" onclick="jumpToPercentage(25)">25%</button>
                        <button class="bookmark-btn" onclick="jumpToPercentage(50)">50%</button>
                        <button class="bookmark-btn" onclick="jumpToPercentage(75)">75%</button>
                        <button class="bookmark-btn" onclick="addCustomBookmark()">+ Bookmark</button>
                    </div>
                    
                    <div class="audio-keyboard-hint">
                        Space: play/pause • ←→: skip 15s • ↑↓: chapters • A: auto-advance • 1-6: speed • B: bookmark
                    </div>
                </div>
            `;
        }
        
        function initializeAudioPlayer(chapter) {
            const audioElement = document.getElementById('audioPlayer');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const currentTimeSpan = document.getElementById('currentTime');
            const totalTimeSpan = document.getElementById('totalTime');
            const volumeSlider = document.getElementById('volumeSlider');
            const autoAdvanceToggle = document.getElementById('autoAdvanceToggle');
            
            if (!audioElement) return;
            
            // Stop any currently playing audio
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                clearInterval(audioProgressInterval);
            }
            
            currentAudio = audioElement;
            currentPlayingChapter = chapter.id;
            
            // Set initial volume
            audioElement.volume = currentVolume;
            volumeSlider.value = currentVolume;
            
            // Audio event listeners
            audioElement.addEventListener('loadedmetadata', () => {
                totalTimeSpan.textContent = formatTime(audioElement.duration);
                updateChapterNavigation();
            });
            
            audioElement.addEventListener('timeupdate', updateProgress);
            audioElement.addEventListener('ended', handleAudioEnded);
            audioElement.addEventListener('play', () => {
                isPlaying = true;
                updatePlayPauseButton();
                markChapterAsPlaying(chapter.id);
                startProgressTracking();
            });
            
            audioElement.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayPauseButton();
                clearChapterPlaying();
                stopProgressTracking();
            });
            
            audioElement.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                showAudioError('Failed to load audio file');
            });
            
            // Volume control
            volumeSlider.addEventListener('input', (e) => {
                const volume = parseFloat(e.target.value);
                audioElement.volume = volume;
                currentVolume = volume;
                localStorage.setItem('audioVolume_' + bookId, volume.toString());
            });
            
            // Initialize playback rate
            setPlaybackRate(currentPlaybackRate);
            updateAutoAdvanceToggle();
        }
        
        function togglePlayPause() {
            if (!currentAudio) return;
            
            if (currentAudio.paused) {
                currentAudio.play().catch(e => {
                    console.error('Play failed:', e);
                    showAudioError('Failed to play audio');
                });
            } else {
                currentAudio.pause();
            }
        }
        
        function updatePlayPauseButton() {
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }
        
        function skipAudio(seconds) {
            if (!currentAudio) return;
            currentAudio.currentTime = Math.max(0, Math.min(currentAudio.duration, currentAudio.currentTime + seconds));
        }
        
        function seekAudio(event) {
            if (!currentAudio) return;
            const progressBar = event.currentTarget;
            const rect = progressBar.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;
            currentAudio.currentTime = percentage * currentAudio.duration;
        }
        
        function updateProgress() {
            if (!currentAudio) return;
            
            const progressFill = document.getElementById('progressFill');
            const currentTimeSpan = document.getElementById('currentTime');
            const progressHandle = document.getElementById('progressHandle');
            
            const percentage = (currentAudio.currentTime / currentAudio.duration) * 100;
            progressFill.style.width = percentage + '%';
            progressHandle.style.left = percentage + '%';
            currentTimeSpan.textContent = formatTime(currentAudio.currentTime);
            
            // Update visualizer during playback
            updateAudioVisualizer();
        }
        
        function setPlaybackRate(rate) {
            if (!currentAudio) return;
            
            currentAudio.playbackRate = rate;
            currentPlaybackRate = rate;
            
            // Update active speed button
            document.querySelectorAll('.speed-button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === rate + 'x') {
                    btn.classList.add('active');
                }
            });
        }
        
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }
        
        function navigateToChapterAudio(direction) {
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
            const newIndex = currentIndex + direction;
            
            if (newIndex >= 0 && newIndex < chaptersData.length) {
                const newChapter = chaptersData[newIndex];
                selectChapter(newChapter.id);
                
                // If the new chapter has audio and we're on narrative, auto-play
                setTimeout(() => {
                    if (currentSummaryType === '_response_narrative.md' && 
                        newChapter.audio && newChapter.audio.audio_file) {
                        selectSummaryType('_response_narrative.md');
                    }
                }, 100);
            }
        }
        
        function handleAudioEnded() {
            if (autoAdvance) {
                const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
                if (currentIndex < chaptersData.length - 1) {
                    navigateToChapterAudio(1);
                }
            }
            clearChapterPlaying();
        }
        
        function toggleAutoAdvance() {
            autoAdvance = !autoAdvance;
            localStorage.setItem('autoAdvance_' + bookId, JSON.stringify(autoAdvance));
            updateAutoAdvanceToggle();
        }
        
        function updateAutoAdvanceToggle() {
            const toggle = document.getElementById('autoAdvanceToggle');
            if (toggle) {
                if (autoAdvance) {
                    toggle.classList.add('active');
                } else {
                    toggle.classList.remove('active');
                }
            }
        }
        
        function updateChapterNavigation() {
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
            const prevBtn = document.getElementById('prevChapterBtn');
            const nextBtn = document.getElementById('nextChapterBtn');
            
            if (prevBtn) prevBtn.disabled = currentIndex <= 0;
            if (nextBtn) nextBtn.disabled = currentIndex >= chaptersData.length - 1;
        }
        
        // Remove old markChapterAsPlaying and clearChapterPlaying - replaced with enhanced versions above
        
        function startProgressTracking() {
            stopProgressTracking(); // Clear any existing interval
            audioProgressInterval = setInterval(updateProgress, 250);
        }
        
        function stopProgressTracking() {
            if (audioProgressInterval) {
                clearInterval(audioProgressInterval);
                audioProgressInterval = null;
            }
        }
        
        function showAudioError(message) {
            const container = document.getElementById('audioPlayerContainer');
            if (container) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'audio-error';
                errorDiv.textContent = message;
                container.appendChild(errorDiv);
                
                setTimeout(() => {
                    errorDiv.remove();
                }, 5000);
            }
        }
        
        // Enhanced Keyboard navigation with audio support
        document.addEventListener('keydown', (e) => {
            // Ignore keyboard events if user is typing in an input
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
            
            if (e.key === 'ArrowDown' && currentIndex < chaptersData.length - 1) {
                selectChapter(chaptersData[currentIndex + 1].id);
            } else if (e.key === 'ArrowUp' && currentIndex > 0) {
                selectChapter(chaptersData[currentIndex - 1].id);
            } else if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                togglePlayPause();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                skipAudio(-15);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                skipAudio(15);
            } else if (e.key.toLowerCase() === 'a') {
                e.preventDefault();
                toggleAutoAdvance();
            } else if (e.key >= '1' && e.key <= '6') {
                // Speed control shortcuts
                const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
                const speedIndex = parseInt(e.key) - 1;
                if (speeds[speedIndex]) {
                    e.preventDefault();
                    setPlaybackRate(speeds[speedIndex]);
                }
            } else if (e.key.toLowerCase() === 'b') {
                e.preventDefault();
                addCustomBookmark();
            }
        });
        
        // Read tracking functions
        function toggleReadStatus() {
            if (!currentChapter) return;
            
            const chapterId = currentChapter.id;
            const isCurrentlyRead = readChapters.includes(chapterId);
            
            if (isCurrentlyRead) {
                readChapters = readChapters.filter(id => id !== chapterId);
            } else {
                readChapters.push(chapterId);
            }
            
            localStorage.setItem('readChapters_' + bookId, JSON.stringify(readChapters));
            
            // Update UI
            renderChapterList();
            updateProgress();
            displaySummary();
            
            // Re-select current chapter to maintain active state
            const activeIndex = chaptersData.findIndex(c => c.id === chapterId);
            document.querySelectorAll('.chapter-item')[activeIndex].classList.add('active');
        }
        
        function updateProgress() {
            const readCount = readChapters.length;
            const totalCount = chaptersData.length;
            const progressPercent = totalCount > 0 ? Math.round((readCount / totalCount) * 100) : 0;
            
            document.getElementById('readCount').textContent = readCount;
            document.getElementById('progressPercent').textContent = progressPercent + '%';
        }
        
        // Mobile navigation functions
        function updateMobileNavigation(currentIndex) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentIndex <= 0;
            nextBtn.disabled = currentIndex >= chaptersData.length - 1;
        }
        
        function navigateChapter(direction) {
            if (!currentChapter || !currentSummaryType) return;
            
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter.id);
            const newIndex = currentIndex + direction;
            
            if (newIndex >= 0 && newIndex < chaptersData.length) {
                // Store current summary type to preserve it
                const preservedSummaryType = currentSummaryType;
                selectChapter(chaptersData[newIndex].id);
                
                // Restore the summary type after chapter selection
                if (chaptersData[newIndex].summaries[preservedSummaryType]) {
                    selectSummaryType(preservedSummaryType);
                }
            }
        }
        
        // Touch/swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        
        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            const swipeDistance = touchEndX - touchStartX;
            
            if (Math.abs(swipeDistance) > swipeThreshold) {
                if (swipeDistance > 0) {
                    // Swipe right - go to previous chapter
                    navigateChapter(-1);
                } else {
                    // Swipe left - go to next chapter
                    navigateChapter(1);
                }
            }
        }
        
        // Enhanced Audio Features
        function initializeAudioVisualizer() {
            const visualizer = document.getElementById('audioVisualizer');
            if (!visualizer) return;
            
            visualizer.innerHTML = '';
            visualizerBars = [];
            
            // Create 20 audio bars
            for (let i = 0; i < 20; i++) {
                const bar = document.createElement('div');
                bar.className = 'audio-bar';
                bar.style.height = '5px';
                visualizer.appendChild(bar);
                visualizerBars.push(bar);
            }
        }
        
        function updateAudioVisualizer() {
            if (!visualizerBars.length || !currentAudio || currentAudio.paused) {
                visualizerBars.forEach(bar => {
                    bar.style.height = '5px';
                    bar.classList.remove('active');
                });
                return;
            }
            
            // Simulate audio frequency data for visualizer
            visualizerBars.forEach((bar, index) => {
                const height = Math.random() * 25 + 5;
                bar.style.height = height + 'px';
                bar.classList.add('active');
                
                // Make some bars more active based on audio progress
                if (Math.random() > 0.7) {
                    bar.style.height = (height * 1.5) + 'px';
                }
            });
        }
        
        function setSleepTimer(minutes) {
            // Clear existing timer
            if (sleepTimer) {
                clearInterval(sleepTimer);
                sleepTimer = null;
            }
            
            // Update button states
            document.querySelectorAll('.sleep-timer-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            if (minutes === 0) {
                sleepTimeRemaining = 0;
                document.getElementById('sleepTimerDisplay').textContent = 'Off';
                return;
            }
            
            // Set new timer
            sleepTimeRemaining = minutes * 60; // Convert to seconds
            event.target.classList.add('active');
            
            sleepTimer = setInterval(() => {
                sleepTimeRemaining--;
                const mins = Math.floor(sleepTimeRemaining / 60);
                const secs = sleepTimeRemaining % 60;
                document.getElementById('sleepTimerDisplay').textContent = 
                    `${mins}:${secs.toString().padStart(2, '0')}`;
                
                if (sleepTimeRemaining <= 0) {
                    // Timer finished - pause audio and clear timer
                    if (currentAudio && !currentAudio.paused) {
                        currentAudio.pause();
                        updatePlayPauseButton();
                    }
                    setSleepTimer(0);
                }
            }, 1000);
        }
        
        function jumpToPercentage(percentage) {
            if (!currentAudio || !currentAudio.duration) return;
            
            const newTime = (currentAudio.duration * percentage) / 100;
            currentAudio.currentTime = newTime;
            updateAudioProgress();
        }
        
        function addCustomBookmark() {
            if (!currentAudio || !currentChapter) return;
            
            const currentTime = currentAudio.currentTime;
            const chapterId = currentChapter.id;
            
            if (!audioBookmarks[chapterId]) {
                audioBookmarks[chapterId] = [];
            }
            
            const bookmark = {
                time: currentTime,
                label: `${Math.floor(currentTime / 60)}:${Math.floor(currentTime % 60).toString().padStart(2, '0')}`,
                timestamp: Date.now()
            };
            
            audioBookmarks[chapterId].push(bookmark);
            localStorage.setItem('audioBookmarks_' + bookId, JSON.stringify(audioBookmarks));
            
            // Show notification
            const container = document.getElementById('audioPlayerContainer');
            const notification = document.createElement('div');
            notification.className = 'audio-error';
            notification.style.background = '#e8f5e8';
            notification.style.color = '#2d5d2d';
            notification.style.border = '1px solid #7a9a7e';
            notification.textContent = `Bookmark added at ${bookmark.label}`;
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
            
            updateBookmarkDisplay();
        }
        
        function updateBookmarkDisplay() {
            const bookmarksContainer = document.getElementById('audioBookmarks');
            if (!bookmarksContainer || !currentChapter) return;
            
            const chapterId = currentChapter.id;
            const chapterBookmarks = audioBookmarks[chapterId] || [];
            
            // Find existing custom bookmarks container or create one
            let customContainer = bookmarksContainer.querySelector('.custom-bookmarks');
            if (!customContainer && chapterBookmarks.length > 0) {
                customContainer = document.createElement('div');
                customContainer.className = 'custom-bookmarks';
                customContainer.style.marginTop = '8px';
                customContainer.style.paddingTop = '8px';
                customContainer.style.borderTop = '1px solid var(--border-color)';
                bookmarksContainer.appendChild(customContainer);
            }
            
            if (customContainer) {
                if (chapterBookmarks.length > 0) {
                    customContainer.innerHTML = '<div style="font-size: 0.75rem; margin-bottom: 4px; color: var(--text-secondary);">Custom Bookmarks:</div>';
                    
                    chapterBookmarks.forEach((bookmark, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'bookmark-btn';
                        btn.textContent = bookmark.label;
                        btn.onclick = () => {
                            if (currentAudio) {
                                currentAudio.currentTime = bookmark.time;
                                updateAudioProgress();
                            }
                        };
                        
                        // Add delete functionality on right-click
                        btn.oncontextmenu = (e) => {
                            e.preventDefault();
                            if (confirm(`Delete bookmark at ${bookmark.label}?`)) {
                                audioBookmarks[chapterId].splice(index, 1);
                                if (audioBookmarks[chapterId].length === 0) {
                                    delete audioBookmarks[chapterId];
                                }
                                localStorage.setItem('audioBookmarks_' + bookId, JSON.stringify(audioBookmarks));
                                updateBookmarkDisplay();
                            }
                        };
                        
                        customContainer.appendChild(btn);
                    });
                } else {
                    customContainer.remove();
                }
            }
        }
        
        function markChapterAsPlaying(chapterId) {
            // Remove playing state from all chapters
            document.querySelectorAll('.chapter-item').forEach(item => {
                item.classList.remove('playing', 'chapter-playing');
            });
            
            // Add playing state to current chapter
            const chapterIndex = chaptersData.findIndex(c => c.id === chapterId);
            if (chapterIndex >= 0) {
                const chapterElements = document.querySelectorAll('.chapter-item');
                if (chapterElements[chapterIndex]) {
                    chapterElements[chapterIndex].classList.add('playing', 'chapter-playing');
                }
            }
        }
        
        function clearChapterPlaying() {
            document.querySelectorAll('.chapter-item').forEach(item => {
                item.classList.remove('playing', 'chapter-playing');
            });
        }
        
        // Audio visualizer is now integrated into the main updateProgress function
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
