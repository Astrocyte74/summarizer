                    <div class="audio-metadata">
                        <div><strong>Word Count:</strong> ${audio.word_count || 'Unknown'} words</div>
                        <div><strong>Generated:</strong> ${audio.generation_timestamp ? new Date(audio.generation_timestamp).toLocaleDateString() : 'Unknown'}</div>
                    </div>
                    
                    <div class="chapter-navigation">
                        <span>Chapter Navigation:</span>
                        <div class="auto-advance-toggle">
                            <span>Auto-advance</span>
                            <div class="toggle-switch ${autoAdvance ? 'active' : ''}" id="autoAdvanceToggle" onclick="toggleAutoAdvance()">
                                <div class="toggle-handle"></div>
                            </div>
                        </div>
                        <div class="sleep-timer">
                            <span>Sleep Timer:</span>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(5)">5m</button>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(10)">10m</button>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(15)">15m</button>
                            <button class="sleep-timer-btn" onclick="setSleepTimer(30)">30m</button>
                            <div class="sleep-timer-display" id="sleepTimerDisplay">Off</div>
                        </div>
                    </div>
                    
                    <div class="audio-bookmarks" id="audioBookmarks">
                        <div style="font-size: 0.8rem; margin-bottom: 8px; color: var(--text-secondary);">Quick Bookmarks:</div>
                        <button class="bookmark-btn" onclick="jumpToPercentage(0)">Start</button>
                        <button class="bookmark-btn" onclick="jumpToPercentage(25)">25%</button>
                        <button class="bookmark-btn" onclick="jumpToPercentage(50)">50%</button>
                        <button class="bookmark-btn" onclick="jumpToPercentage(75)">75%</button>
                        <button class="bookmark-btn" onclick="addCustomBookmark()">+ Bookmark</button>
                    </div>
                    
                    <div class="audio-keyboard-hint">
                        Space: play/pause • ←→: skip 15s • ↑↓: chapters • A: auto-advance • 1-6: speed • B: bookmark
                    </div>
                </div>
            `;
        }
        
        function initializeAudioPlayer(chapter) {
            const audioElement = document.getElementById('audioPlayer');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const currentTimeSpan = document.getElementById('currentTime');
            const totalTimeSpan = document.getElementById('totalTime');
            const volumeSlider = document.getElementById('volumeSlider');
            const autoAdvanceToggle = document.getElementById('autoAdvanceToggle');
            
            if (!audioElement) return;
            
            // Stop any currently playing audio
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                clearInterval(audioProgressInterval);
            }
            
            currentAudio = audioElement;
            currentPlayingChapter = chapter.id;
            
            // Set initial volume
            audioElement.volume = currentVolume;
            volumeSlider.value = currentVolume;
            
            // Audio event listeners
            audioElement.addEventListener('loadedmetadata', () => {
                totalTimeSpan.textContent = formatTime(audioElement.duration);
                updateChapterNavigation();
            });
            
            audioElement.addEventListener('timeupdate', updateProgress);
            audioElement.addEventListener('ended', handleAudioEnded);
            audioElement.addEventListener('play', () => {
                isPlaying = true;
                updatePlayPauseButton();
                markChapterAsPlaying(chapter.id);
                startProgressTracking();
            });
            
            audioElement.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayPauseButton();
                clearChapterPlaying();
                stopProgressTracking();
            });
            
            audioElement.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                showAudioError('Failed to load audio file');
            });
            
            // Volume control
            volumeSlider.addEventListener('input', (e) => {
                const volume = parseFloat(e.target.value);
                audioElement.volume = volume;
                currentVolume = volume;
                localStorage.setItem('audioVolume_' + bookId, volume.toString());
            });
            
            // Initialize playback rate
            setPlaybackRate(currentPlaybackRate);
            updateAutoAdvanceToggle();
        }
        
        function togglePlayPause() {
            if (!currentAudio) return;
            
            if (currentAudio.paused) {
                currentAudio.play().catch(e => {
                    console.error('Play failed:', e);
                    showAudioError('Failed to play audio');
                });
            } else {
                currentAudio.pause();
            }
        }
        
        function updatePlayPauseButton() {
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }
        
        function skipAudio(seconds) {
            if (!currentAudio) return;
            currentAudio.currentTime = Math.max(0, Math.min(currentAudio.duration, currentAudio.currentTime + seconds));
        }
        
        function seekAudio(event) {
            if (!currentAudio) return;
            const progressBar = event.currentTarget;
            const rect = progressBar.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;
            currentAudio.currentTime = percentage * currentAudio.duration;
        }
        
        function updateProgress() {
            if (!currentAudio) return;
            
            const progressFill = document.getElementById('progressFill');
            const currentTimeSpan = document.getElementById('currentTime');
            const progressHandle = document.getElementById('progressHandle');
            
            const percentage = (currentAudio.currentTime / currentAudio.duration) * 100;
            progressFill.style.width = percentage + '%';
            progressHandle.style.left = percentage + '%';
            currentTimeSpan.textContent = formatTime(currentAudio.currentTime);
            
            // Update visualizer during playback
            updateAudioVisualizer();
        }
        
        function setPlaybackRate(rate) {
            if (!currentAudio) return;
            
            currentAudio.playbackRate = rate;
            currentPlaybackRate = rate;
            
            // Update active speed button
            document.querySelectorAll('.speed-button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === rate + 'x') {
                    btn.classList.add('active');
                }
            });
        }
        
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }
        
        function navigateToChapterAudio(direction) {
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
            const newIndex = currentIndex + direction;
            
            if (newIndex >= 0 && newIndex < chaptersData.length) {
                const newChapter = chaptersData[newIndex];
                selectChapter(newChapter.id);
                
                // If the new chapter has audio and we're on narrative, auto-play
                setTimeout(() => {
                    if (currentSummaryType === '_response_narrative.md' && 
                        newChapter.audio && newChapter.audio.audio_file) {
                        selectSummaryType('_response_narrative.md');
                    }
                }, 100);
            }
        }
        
        function handleAudioEnded() {
            if (autoAdvance) {
                const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
                if (currentIndex < chaptersData.length - 1) {
                    navigateToChapterAudio(1);
                }
            }
            clearChapterPlaying();
        }
        
        function toggleAutoAdvance() {
            autoAdvance = !autoAdvance;
            localStorage.setItem('autoAdvance_' + bookId, JSON.stringify(autoAdvance));
            updateAutoAdvanceToggle();
        }
        
        function updateAutoAdvanceToggle() {
            const toggle = document.getElementById('autoAdvanceToggle');
            if (toggle) {
                if (autoAdvance) {
                    toggle.classList.add('active');
                } else {
                    toggle.classList.remove('active');
                }
            }
        }
        
        function updateChapterNavigation() {
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
            const prevBtn = document.getElementById('prevChapterBtn');
            const nextBtn = document.getElementById('nextChapterBtn');
            
            if (prevBtn) prevBtn.disabled = currentIndex <= 0;
            if (nextBtn) nextBtn.disabled = currentIndex >= chaptersData.length - 1;
        }
        
        // Remove old markChapterAsPlaying and clearChapterPlaying - replaced with enhanced versions above
        
        function startProgressTracking() {
            stopProgressTracking(); // Clear any existing interval
            audioProgressInterval = setInterval(updateProgress, 250);
        }
        
        function stopProgressTracking() {
            if (audioProgressInterval) {
                clearInterval(audioProgressInterval);
                audioProgressInterval = null;
            }
        }
        
        function showAudioError(message) {
            const container = document.getElementById('audioPlayerContainer');
            if (container) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'audio-error';
                errorDiv.textContent = message;
                container.appendChild(errorDiv);
                
                setTimeout(() => {
                    errorDiv.remove();
                }, 5000);
            }
        }
        
        // Enhanced Keyboard navigation with audio support
        document.addEventListener('keydown', (e) => {
            // Ignore keyboard events if user is typing in an input
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter?.id);
            
            if (e.key === 'ArrowDown' && currentIndex < chaptersData.length - 1) {
                selectChapter(chaptersData[currentIndex + 1].id);
            } else if (e.key === 'ArrowUp' && currentIndex > 0) {
                selectChapter(chaptersData[currentIndex - 1].id);
            } else if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                togglePlayPause();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                skipAudio(-15);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                skipAudio(15);
            } else if (e.key.toLowerCase() === 'a') {
                e.preventDefault();
                toggleAutoAdvance();
            } else if (e.key >= '1' && e.key <= '6') {
                // Speed control shortcuts
                const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
                const speedIndex = parseInt(e.key) - 1;
                if (speeds[speedIndex]) {
                    e.preventDefault();
                    setPlaybackRate(speeds[speedIndex]);
                }
            } else if (e.key.toLowerCase() === 'b') {
                e.preventDefault();
                addCustomBookmark();
            }
        });
        
        // Read tracking functions
        function toggleReadStatus() {
            if (!currentChapter) return;
            
            const chapterId = currentChapter.id;
            const isCurrentlyRead = readChapters.includes(chapterId);
            
            if (isCurrentlyRead) {
                readChapters = readChapters.filter(id => id !== chapterId);
            } else {
                readChapters.push(chapterId);
            }
            
            localStorage.setItem('readChapters_' + bookId, JSON.stringify(readChapters));
            
            // Update UI
            renderChapterList();
            updateProgress();
            displaySummary();
            
            // Re-select current chapter to maintain active state
            const activeIndex = chaptersData.findIndex(c => c.id === chapterId);
            document.querySelectorAll('.chapter-item')[activeIndex].classList.add('active');
        }
        
        function updateProgress() {
            const readCount = readChapters.length;
            const totalCount = chaptersData.length;
            const progressPercent = totalCount > 0 ? Math.round((readCount / totalCount) * 100) : 0;
            
            document.getElementById('readCount').textContent = readCount;
            document.getElementById('progressPercent').textContent = progressPercent + '%';
        }
        
        // Mobile navigation functions
        function updateMobileNavigation(currentIndex) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentIndex <= 0;
            nextBtn.disabled = currentIndex >= chaptersData.length - 1;
        }
        
        function navigateChapter(direction) {
            if (!currentChapter || !currentSummaryType) return;
            
            const currentIndex = chaptersData.findIndex(c => c.id === currentChapter.id);
            const newIndex = currentIndex + direction;
            
            if (newIndex >= 0 && newIndex < chaptersData.length) {
                // Store current summary type to preserve it
                const preservedSummaryType = currentSummaryType;
                selectChapter(chaptersData[newIndex].id);
                
                // Restore the summary type after chapter selection
                if (chaptersData[newIndex].summaries[preservedSummaryType]) {
                    selectSummaryType(preservedSummaryType);
                }
            }
        }
        
        // Touch/swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        
        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            const swipeDistance = touchEndX - touchStartX;
            
            if (Math.abs(swipeDistance) > swipeThreshold) {
                if (swipeDistance > 0) {
                    // Swipe right - go to previous chapter
                    navigateChapter(-1);
                } else {
                    // Swipe left - go to next chapter
                    navigateChapter(1);
                }
            }
        }
        
        // Enhanced Audio Features
        function initializeAudioVisualizer() {
            const visualizer = document.getElementById('audioVisualizer');
            if (!visualizer) return;
            
            visualizer.innerHTML = '';
            visualizerBars = [];
            
            // Create 20 audio bars
            for (let i = 0; i < 20; i++) {
                const bar = document.createElement('div');
                bar.className = 'audio-bar';
                bar.style.height = '5px';
                visualizer.appendChild(bar);
                visualizerBars.push(bar);
            }
        }
        
        function updateAudioVisualizer() {
            if (!visualizerBars.length || !currentAudio || currentAudio.paused) {
                visualizerBars.forEach(bar => {
                    bar.style.height = '5px';
                    bar.classList.remove('active');
                });
                return;
            }
            
            // Simulate audio frequency data for visualizer
            visualizerBars.forEach((bar, index) => {
                const height = Math.random() * 25 + 5;
                bar.style.height = height + 'px';
                bar.classList.add('active');
                
                // Make some bars more active based on audio progress
                if (Math.random() > 0.7) {
                    bar.style.height = (height * 1.5) + 'px';
                }
            });
        }
        
        function setSleepTimer(minutes) {
            // Clear existing timer
            if (sleepTimer) {
                clearInterval(sleepTimer);
                sleepTimer = null;
            }
            
            // Update button states
            document.querySelectorAll('.sleep-timer-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            if (minutes === 0) {
                sleepTimeRemaining = 0;
                document.getElementById('sleepTimerDisplay').textContent = 'Off';
                return;
            }
            
            // Set new timer
            sleepTimeRemaining = minutes * 60; // Convert to seconds
            event.target.classList.add('active');
            
            sleepTimer = setInterval(() => {
                sleepTimeRemaining--;
                const mins = Math.floor(sleepTimeRemaining / 60);
                const secs = sleepTimeRemaining % 60;
                document.getElementById('sleepTimerDisplay').textContent = 
                    `${mins}:${secs.toString().padStart(2, '0')}`;
                
                if (sleepTimeRemaining <= 0) {
                    // Timer finished - pause audio and clear timer
                    if (currentAudio && !currentAudio.paused) {
                        currentAudio.pause();
                        updatePlayPauseButton();
                    }
                    setSleepTimer(0);
                }
            }, 1000);
        }
        
        function jumpToPercentage(percentage) {
            if (!currentAudio || !currentAudio.duration) return;
            
            const newTime = (currentAudio.duration * percentage) / 100;
            currentAudio.currentTime = newTime;
            updateAudioProgress();
        }
        
        function addCustomBookmark() {
            if (!currentAudio || !currentChapter) return;
            
            const currentTime = currentAudio.currentTime;
            const chapterId = currentChapter.id;
            
            if (!audioBookmarks[chapterId]) {
                audioBookmarks[chapterId] = [];
            }
            
            const bookmark = {
                time: currentTime,
                label: `${Math.floor(currentTime / 60)}:${Math.floor(currentTime % 60).toString().padStart(2, '0')}`,
                timestamp: Date.now()
            };
            
            audioBookmarks[chapterId].push(bookmark);
            localStorage.setItem('audioBookmarks_' + bookId, JSON.stringify(audioBookmarks));
            
            // Show notification
            const container = document.getElementById('audioPlayerContainer');
            const notification = document.createElement('div');
            notification.className = 'audio-error';
            notification.style.background = '#e8f5e8';
            notification.style.color = '#2d5d2d';
            notification.style.border = '1px solid #7a9a7e';
            notification.textContent = `Bookmark added at ${bookmark.label}`;
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
            
            updateBookmarkDisplay();
        }
        
        function updateBookmarkDisplay() {
            const bookmarksContainer = document.getElementById('audioBookmarks');
            if (!bookmarksContainer || !currentChapter) return;
            
            const chapterId = currentChapter.id;
            const chapterBookmarks = audioBookmarks[chapterId] || [];
            
            // Find existing custom bookmarks container or create one
            let customContainer = bookmarksContainer.querySelector('.custom-bookmarks');
            if (!customContainer && chapterBookmarks.length > 0) {
                customContainer = document.createElement('div');
                customContainer.className = 'custom-bookmarks';
                customContainer.style.marginTop = '8px';
                customContainer.style.paddingTop = '8px';
                customContainer.style.borderTop = '1px solid var(--border-color)';
                bookmarksContainer.appendChild(customContainer);
            }
            
            if (customContainer) {
                if (chapterBookmarks.length > 0) {
                    customContainer.innerHTML = '<div style="font-size: 0.75rem; margin-bottom: 4px; color: var(--text-secondary);">Custom Bookmarks:</div>';
                    
                    chapterBookmarks.forEach((bookmark, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'bookmark-btn';
                        btn.textContent = bookmark.label;
                        btn.onclick = () => {
                            if (currentAudio) {
                                currentAudio.currentTime = bookmark.time;
                                updateAudioProgress();
                            }
                        };
                        
                        // Add delete functionality on right-click
                        btn.oncontextmenu = (e) => {
                            e.preventDefault();
                            if (confirm(`Delete bookmark at ${bookmark.label}?`)) {
                                audioBookmarks[chapterId].splice(index, 1);
                                if (audioBookmarks[chapterId].length === 0) {
                                    delete audioBookmarks[chapterId];
                                }
                                localStorage.setItem('audioBookmarks_' + bookId, JSON.stringify(audioBookmarks));
                                updateBookmarkDisplay();
                            }
                        };
                        
                        customContainer.appendChild(btn);
                    });
                } else {
                    customContainer.remove();
                }
            }
        }
        
        function markChapterAsPlaying(chapterId) {
            // Remove playing state from all chapters
            document.querySelectorAll('.chapter-item').forEach(item => {
                item.classList.remove('playing', 'chapter-playing');
            });
            
            // Add playing state to current chapter
            const chapterIndex = chaptersData.findIndex(c => c.id === chapterId);
            if (chapterIndex >= 0) {
                const chapterElements = document.querySelectorAll('.chapter-item');
                if (chapterElements[chapterIndex]) {
                    chapterElements[chapterIndex].classList.add('playing', 'chapter-playing');
                }
            }
        }
        
        function clearChapterPlaying() {
            document.querySelectorAll('.chapter-item').forEach(item => {
                item.classList.remove('playing', 'chapter-playing');
            });
        }
        
        // Audio visualizer is now integrated into the main updateProgress function
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
